<style>
/* Layout: 試験問題冊子のような一列構成。上部に固定の状況バー（残り時間・解答数・得点）、下に設問。 */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --ink:#1d2321; --muted:#5d6763; --line:#d6dad7;
  --accent:#b3261e; --accent-soft:#f6e3e1; --ok:#1f7a4d; --ok-soft:#e1f2e8; --ng:#b3261e; --ng-soft:#f8e1df; --sel:#24435c; --sel-soft:#e2ebf2;
  --f-disp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151918; --surface:#1e2321; --ink:#e7ebe9; --muted:#9aa49f; --line:#333a37;
  --accent:#ef7b70; --accent-soft:#3a2321; --ok:#6fcf9a; --ok-soft:#1d3328; --ng:#ef7b70; --ng-soft:#3a2321; --sel:#9cc3e3; --sel-soft:#1f2f3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151918; --surface:#1e2321; --ink:#e7ebe9; --muted:#9aa49f; --line:#333a37;
  --accent:#ef7b70; --accent-soft:#3a2321; --ok:#6fcf9a; --ok-soft:#1d3328; --ng:#ef7b70; --ng-soft:#3a2321; --sel:#9cc3e3; --sel-soft:#1f2f3c; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
header h1{font-family:var(--f-disp);font-weight:900;font-size:1.7rem;margin:0;letter-spacing:.02em;text-wrap:balance}
header .tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--accent);border:1.5px solid var(--accent);padding:1px 8px;border-radius:3px;margin-bottom:6px}
header p{color:var(--muted);margin:.4rem 0 0;font-size:.88rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.modes button{font:inherit;font-weight:700;border:0;background:var(--surface);color:var(--muted);padding:9px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button{font:inherit}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);margin-top:14px}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.sc b{display:block;font-size:.7rem;color:var(--muted);font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc span{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1rem}
.sc.pass{border-color:var(--ok)} .sc.fail{border-color:var(--ng)} .sc.warn span{color:var(--accent)}
.judge{margin-top:8px;font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.ok-t{color:var(--ok)} .ng-t{color:var(--ng)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tabs button{font-size:.82rem;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.85rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.warn{border-color:var(--accent);color:var(--accent)}
.sec{font-family:var(--f-disp);font-weight:700;font-size:1.05rem;margin:28px 0 4px;letter-spacing:.04em}
.subsec{font-size:.8rem;color:var(--muted);margin:0 0 8px;font-weight:700;letter-spacing:.04em}
.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.qh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.no{font-family:var(--f-mono);font-weight:500;color:var(--accent);font-size:.92rem}
.cat{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 6px}
.qt{margin:0 0 10px;font-weight:700}
.ch{display:grid;gap:6px}
.ch button{text-align:left;display:flex;gap:10px;background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ink);cursor:pointer}
.ch button:hover:not(:disabled){border-color:var(--muted)}
.ch button:disabled{cursor:default}
.ch .n{font-family:var(--f-mono);color:var(--muted);flex:none}
.ch button[aria-pressed="true"]{background:var(--sel-soft);border-color:var(--sel)}
.ch button[aria-pressed="true"] .n{color:var(--sel);font-weight:700}
.ch button.right{background:var(--ok-soft);border-color:var(--ok)}
.ch button.wrong{background:var(--ng-soft);border-color:var(--ng)}
.ex{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:.9rem}
.ex .r{font-weight:700}
.fig{display:block;width:100%;max-width:340px;height:auto;margin:4px auto 12px}
.fig .st{stroke:var(--ink)} .fig .fl{fill:var(--surface)} .fig .ac{stroke:var(--accent)} .fig .acf{fill:var(--accent-soft)}
.fig text{fill:var(--ink);font-family:var(--f-body);font-size:11px}
.fig .lb{fill:var(--accent);font-weight:700;font-size:13px}
textarea{width:100%;box-sizing:border-box;min-height:84px;font:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:16px}
.intro h2{font-family:var(--f-disp);font-size:1.15rem;margin:0 0 8px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:700;font-size:.78rem}
td.num{text-align:right;font-family:var(--f-mono)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.self{display:flex;gap:6px;margin-top:8px}
.self button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:4px 14px;cursor:pointer;font-weight:700}
.self button[aria-pressed="true"].o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.self button[aria-pressed="true"].x{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.mine{font-size:.88rem;background:var(--bg);border-radius:6px;padding:6px 10px;white-space:pre-wrap;margin-top:6px}
.note{font-size:.8rem;color:var(--muted);margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
a.btn{text-decoration:none;display:inline-block}
.timer{font-family:var(--f-mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
@media (max-width:420px){.scores{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.ch button{transition:background .15s,border-color .15s}}
</style>

<p class="note">本試験の問題は持ち帰りができず公式に公開されていないため、出題傾向に沿って作成したオリジナルの予想問題です。法令・基準の数値は改正される場合があるので、最新の法令集やテキストで確認してください。本試験の鑑別は写真やイラストで出題されます。ここでは文章と系統図で出題し、解答例の下の「実物の写真を見る」から画像検索で実物を確認できます。</p>

<script>
const G={
 lc:{s:"law",label:"法令 共通",n:6}, lk:{s:"law",label:"法令 類別（第3類）",n:4},
 bm:{s:"basic",label:"基礎 機械",n:3}, be:{s:"basic",label:"基礎 電気",n:2},
 sm:{s:"struct",label:"構造・機能 機械",n:8}, se:{s:"struct",label:"構造・機能 電気",n:4}, ks:{s:"struct",label:"規格",n:3}
};
const ORDER=["lc","lk","bm","be","sm","se","ks"];
const SUBJ={law:{label:"消防関係法令",n:10},basic:{label:"基礎的知識",n:5},struct:{label:"構造・機能・整備",n:15}};

const P=[
// ── 法令 共通 ──
{id:"lc1",g:"lc",q:"消防法に定める「防火対象物」に含まれないものはどれか。",o:["山林","舟車","ふ頭に繋留された船舶","物件"],a:3,e:"「物件」が加わるのは「消防対象物」の定義。防火対象物は、山林・舟車・船きょ又はふ頭に繋留された船舶・建築物その他の工作物若しくはこれらに属する物。"},
{id:"lc2",g:"lc",q:"消防用設備等が技術上の基準に従って設置・維持されていない場合に、必要な措置を命じることができる者として、正しいものはどれか。",o:["都道府県知事","消防庁長官","消防長又は消防署長","市町村長"],a:2,e:"消防長又は消防署長が、防火対象物の関係者で権原を有する者に対して命じる（消防法第17条の4）。"},
{id:"lc3",g:"lc",q:"消防用設備等の点検結果を消防長等へ報告する期間の組合せとして、正しいものはどれか。",o:["特定防火対象物：6か月に1回／その他：1年に1回","特定防火対象物：1年に1回／その他：3年に1回","特定防火対象物：1年に1回／その他：2年に1回","特定防火対象物：3年に1回／その他：5年に1回"],a:1,e:"報告は特定防火対象物が1年に1回、それ以外は3年に1回。点検自体の周期（機器点検6か月・総合点検1年）と混同しないこと。"},
{id:"lc4",g:"lc",q:"免状を亡失して再交付を受けた者が、亡失した免状を発見した場合の義務として、正しいものはどれか。",o:["7日以内に居住地の都道府県知事に提出する","10日以内に再交付をした都道府県知事に提出する","14日以内に免状を交付した消防長に提出する","30日以内に勤務地の都道府県知事に提出する"],a:1,e:"発見した免状を10日以内に、再交付をした都道府県知事に提出しなければならない。"},
{id:"lc5",g:"lc",q:"消防設備士の講習の受講時期として、正しいものはどれか。",o:["免状交付日以後の最初の4月1日から2年以内、その後は講習を受けた日以後の最初の4月1日から5年以内","免状交付日から3年以内、その後は5年ごと","免状交付日以後の最初の4月1日から5年以内、その後も5年以内ごと","免状交付日から1年以内、その後は3年ごと"],a:0,e:"最初は「交付日以後の最初の4月1日から2年以内」、以後は「受講日以後の最初の4月1日から5年以内」。"},
{id:"lc6",g:"lc",q:"工事整備対象設備等の着工届について、正しいものはどれか。",o:["防火対象物の関係者が、工事完了後4日以内に届け出る","甲種消防設備士が、工事着手日の10日前までに消防長又は消防署長に届け出る","乙種消防設備士が、工事着手日の7日前までに都道府県知事に届け出る","工事請負業者が、工事着手日の前日までに市町村長に届け出る"],a:1,e:"着工届は甲種消防設備士が着手10日前までに。工事完了後4日以内に届け出るのは「設置届」で、届出者は関係者。"},
{id:"lc7",g:"lc",q:"次の防火対象物のうち、特定防火対象物に該当しないものはどれか。",o:["百貨店","旅館","共同住宅","病院"],a:2,e:"特定防火対象物は不特定多数の者が出入りする施設や、災害時に避難が難しい人がいる施設。共同住宅・学校・事務所・工場・図書館などは非特定。"},
{id:"lc8",g:"lc",q:"消防用設備等を設置したときの届出（設置届）について、正しいものはどれか。",o:["甲種消防設備士が工事着手日の10日前までに届け出る","防火対象物の関係者が工事完了日から4日以内に消防長又は消防署長に届け出る","防火対象物の関係者が工事完了日から10日以内に都道府県知事に届け出る","消防設備士が工事完了日から7日以内に市町村長に届け出る"],a:1,e:"設置届は関係者が工事完了日から4日以内に、消防長（消防本部を置かない市町村は市町村長）又は消防署長へ。届出後に検査を受ける。"},
{id:"lc9",g:"lc",q:"技術上の基準が改正された場合でも、既存の防火対象物（特定防火対象物以外）に改正後の基準が適用される消防用設備等はどれか。",o:["屋内消火栓設備","スプリンクラー設備","誘導灯","不活性ガス消火設備"],a:2,e:"消火器・簡易消火用具・避難器具・誘導灯及び誘導標識・漏電火災警報器・非常警報器具及び設備などは、既存の防火対象物にも常に新基準が適用される。"},
{id:"lc10",g:"lc",q:"消防設備士免状の書換えを申請しなければならない場合として、正しいものはどれか。",o:["現住所が変わったとき","勤務先が変わったとき","氏名が変わったとき","転職して別の会社で整備を行うとき"],a:2,e:"書換えが必要なのは、氏名・本籍地の属する都道府県が変わったとき、添付写真が撮影から10年を経過したときなど。現住所は免状の記載事項ではない。"},
{id:"lc11",g:"lc",q:"検定対象機械器具等の型式承認を行う者として、正しいものはどれか。",o:["日本消防検定協会","総務大臣","都道府県知事","消防庁長官"],a:1,e:"型式承認は総務大臣。型式適合検定は日本消防検定協会又は登録検定機関が行う。検定合格の表示がないものは販売・陳列や工事への使用ができない。"},
{id:"lc12",g:"lc",q:"消防設備士又は消防設備点検資格者に点検させなければならない防火対象物として、正しいものはどれか。",o:["延べ面積500m²の特定防火対象物","延べ面積1,000m²以上の特定防火対象物","延べ面積1,000m²以上のすべての非特定防火対象物","延べ面積300m²の事務所"],a:1,e:"延べ面積1,000m²以上の特定防火対象物、延べ面積1,000m²以上の非特定防火対象物で消防長等が指定したもの、特定一階段等防火対象物が対象。"},
{id:"lc13",g:"lc",q:"「消火活動上必要な施設」に該当しないものはどれか。",o:["排煙設備","連結送水管","非常コンセント設備","動力消防ポンプ設備"],a:3,e:"動力消防ポンプ設備は「消火設備」。消火活動上必要な施設は、排煙設備・連結散水設備・連結送水管・非常コンセント設備・無線通信補助設備。"},
{id:"lc14",g:"lc",q:"消防設備士の義務について、誤っているものはどれか。",o:["業務に従事するときは免状を携帯しなければならない","業務を誠実に行い、工事整備対象設備等の質の向上に努めなければならない","定められた期間ごとに講習を受けなければならない","免状の記載事項に変更が生じても書換えの申請は不要である"],a:3,e:"氏名などの記載事項に変更が生じたときは、遅滞なく書換えを申請しなければならない。"},
// ── 法令 類別 ──
{id:"lk1",g:"lk",q:"変圧器などの電気設備が設置されている部分（床面積200m²以上）に設置できない消火設備はどれか。",o:["不活性ガス消火設備","ハロゲン化物消火設備","粉末消火設備","泡消火設備"],a:3,e:"電気設備の部分は不活性ガス・ハロゲン化物・粉末のいずれか。泡や水系は感電・絶縁の面から対象外。"},
{id:"lk2",g:"lk",q:"地階にある駐車の用に供される部分で、水噴霧・泡・不活性ガス・ハロゲン化物・粉末消火設備のいずれかの設置が必要となる床面積はどれか。",o:["100m²以上","200m²以上","300m²以上","500m²以上"],a:1,e:"地階又は2階以上は200m²以上、1階は500m²以上、屋上部分は300m²以上。"},
{id:"lk3",g:"lk",q:"通信機器室に不活性ガス・ハロゲン化物・粉末消火設備のいずれかを設置しなければならない床面積はどれか。",o:["200m²以上","300m²以上","500m²以上","1,000m²以上"],a:2,e:"通信機器室は500m²以上。鍛造場・ボイラー室など多量の火気を使う部分や電気設備の部分は200m²以上。"},
{id:"lk4",g:"lk",q:"乙種第3類消防設備士が行うことができるものはどれか。",o:["不活性ガス消火設備の設置工事","粉末消火設備の整備","泡消火設備の整備","屋内消火栓設備の整備"],a:1,e:"乙種は整備（点検含む）のみで工事はできない。第3類は不活性ガス・ハロゲン化物・粉末消火設備。泡は第2類、屋内消火栓は第1類。"},
{id:"lk5",g:"lk",q:"ボイラー室など多量の火気を使用する部分に、不活性ガス・ハロゲン化物・粉末消火設備のいずれかの設置が必要となる床面積はどれか。",o:["500m²以上","300m²以上","200m²以上","100m²以上"],a:2,e:"鍛造場・ボイラー室・乾燥室など多量の火気を使用する部分は200m²以上。"},
{id:"lk6",g:"lk",q:"屋上部分にある駐車の用に供される部分で、水噴霧・泡・不活性ガス等の設置が必要となる床面積はどれか。",o:["200m²以上","300m²以上","400m²以上","600m²以上"],a:1,e:"屋上部分は300m²以上。地階・2階以上は200m²以上、1階は500m²以上。"},
{id:"lk7",g:"lk",q:"機械装置により車両を収容する立体駐車場で、水噴霧・泡・不活性ガス等の設置が必要となる収容台数はどれか。",o:["30台以上","20台以上","10台以上","5台以上"],a:2,e:"昇降機等の機械装置で車両を駐車させる構造のもので、収容台数10台以上。"},
{id:"lk8",g:"lk",q:"道路の用に供される部分で、設置が必要となる床面積の組合せとして、正しいものはどれか。",o:["屋上部分600m²以上／それ以外400m²以上","屋上部分400m²以上／それ以外600m²以上","屋上部分300m²以上／それ以外200m²以上","屋上部分500m²以上／それ以外500m²以上"],a:0,e:"道路の用に供される部分は、屋上部分600m²以上、それ以外の部分400m²以上で、水噴霧・泡・不活性ガス・粉末消火設備のいずれかが必要。"},
{id:"lk9",g:"lk",q:"乙種第3類の免状で整備を行うことができない設備はどれか。",o:["ハロゲン化物消火設備","不活性ガス消火設備","粉末消火設備","水噴霧消火設備"],a:3,e:"水噴霧消火設備は第2類（泡・水噴霧）と同じく第3類の対象外。第3類は不活性ガス・ハロゲン化物・粉末の消火設備。"},

{id:"bm1",g:"bm",q:"容積一定の容器に絶対圧力0.6MPa、温度27℃の気体が入っている。温度を127℃にしたときの絶対圧力はいくらか。",o:["0.45MPa","0.7MPa","0.8MPa","2.8MPa"],a:2,e:"容積一定なので P/T が一定。絶対温度で計算する：0.6 × (400 ÷ 300) = 0.8MPa。"},
{id:"bm2",g:"bm",q:"断面積20mm²の丸棒に4kNの引張荷重がかかるときの引張応力はいくらか。",o:["20N/mm²","80N/mm²","800N/mm²","200N/mm²"],a:3,e:"応力＝荷重÷断面積＝4,000N÷20mm²＝200N/mm²（＝200MPa）。"},
{id:"bm3",g:"bm",q:"黄銅（真ちゅう）の主成分の組合せとして、正しいものはどれか。",o:["銅と亜鉛","銅とすず","鉄とクロム","アルミニウムと銅"],a:0,e:"黄銅＝銅＋亜鉛。青銅＝銅＋すず。ステンレス鋼は鉄にクロム（やニッケル）を加えたもの。"},
{id:"bm4",g:"bm",q:"小ピストンの断面積10cm²、大ピストンの断面積100cm²の油圧装置で、小ピストンに50Nの力を加えた。大ピストンに生じる力はいくらか。",o:["5N","50N","500N","5,000N"],a:2,e:"パスカルの原理より、力は面積比に比例する。50N × (100 ÷ 10) = 500N。"},
{id:"bm5",g:"bm",q:"鋼の熱処理のうち「焼なまし」の主な目的として、正しいものはどれか。",o:["急冷して硬さを増す","焼入れした鋼に粘り強さを与える","内部応力を除去し、軟らかくする","結晶組織を微細化し、標準状態にする"],a:2,e:"焼入れ＝硬化、焼戻し＝粘り強さ、焼なまし＝軟化・内部応力除去、焼ならし＝組織の標準化。"},
{id:"bm6",g:"bm",q:"引張強さ400N/mm²の材料を安全率4で使用するときの許容応力はいくらか。",o:["100N/mm²","400N/mm²","1,600N/mm²","25N/mm²"],a:0,e:"安全率＝基準強さ（引張強さ）÷許容応力。許容応力＝400÷4＝100N/mm²。"},
{id:"bm7",g:"bm",q:"圧力計の指示がゲージ圧力で0.5MPaのとき、絶対圧力はおよそいくらか。",o:["0.4MPa","0.5MPa","0.6MPa","1.5MPa"],a:2,e:"絶対圧力＝ゲージ圧力＋大気圧（約0.1MPa）＝約0.6MPa。"},
{id:"bm8",g:"bm",q:"鉄と銅を接触させて水分のある環境に置いたときの腐食について、正しいものはどれか。",o:["銅が先に腐食する","鉄が先に腐食する","両方とも腐食しない","両方とも同じ速さで腐食する"],a:1,e:"異種金属が接触すると、イオン化傾向の大きい金属（鉄）が先に腐食する。"},

{id:"be1",g:"be",q:"6Ωと3Ωの並列回路に4Ωを直列につなぎ、12Vの電圧を加えた。回路に流れる電流はいくらか。",o:["1A","1.5A","2A","3A"],a:2,e:"並列部分：6×3÷(6+3)＝2Ω。合計2＋4＝6Ω。I＝12÷6＝2A。"},
{id:"be2",g:"be",q:"100Vで2Aが流れる電熱器を5時間使用したときの電力量はいくらか。",o:["1kWh","0.2kWh","0.5kWh","10kWh"],a:0,e:"電力＝100×2＝200W。電力量＝200W×5h＝1,000Wh＝1kWh。"},
{id:"be3",g:"be",q:"導線の長さを2倍、直径を2倍にしたとき、抵抗は元の何倍になるか。",o:["4倍","2倍","1/2倍","1/4倍"],a:2,e:"抵抗は長さに比例し断面積に反比例する。直径2倍で断面積は4倍。2÷4＝1/2倍。"},
{id:"be4",g:"be",q:"実効値100Vの正弦波交流電圧の最大値はおよそいくらか。",o:["約141V","100V","約122V","約173V"],a:0,e:"最大値＝実効値×√2＝100×1.414≒141V。"},
{id:"be5",g:"be",q:"静電容量10μFのコンデンサ2個を直列に接続したときの合成静電容量はいくらか。",o:["20μF","5μF","10μF","100μF"],a:1,e:"直列：1/C＝1/10＋1/10 → C＝5μF。並列なら20μF。抵抗とは逆の計算になる。"},
{id:"be6",g:"be",q:"回路の電流と電圧を測定するときの計器の接続方法として、正しいものはどれか。",o:["電流計・電圧計とも負荷に直列","電流計は並列、電圧計は直列","電流計・電圧計とも負荷に並列","電流計は直列、電圧計は並列"],a:3,e:"電流計は負荷と直列、電圧計は負荷と並列に接続する。"},
// ── 構造・機能 機械 ──
{id:"sm1",g:"sm",q:"二酸化炭素消火剤の主な消火作用はどれか。",o:["冷却作用","窒息作用","負触媒（抑制）作用","乳化作用"],a:1,e:"酸素濃度を下げる窒息作用が主体（冷却作用も多少ある）。負触媒作用が主体なのはハロゲン化物や粉末。"},
{id:"sm2",g:"sm",q:"ハロン1301の化学式はどれか。",o:["CF₂ClBr","C₂F₄Br₂","CF₃Br","CF₂Br₂"],a:2,e:"数字は左から C・F・Cl・Br の数。1301＝C1・F3・Cl0・Br1＝CF₃Br。CF₂ClBrは1211、C₂F₄Br₂は2402。"},
{id:"sm3",g:"sm",q:"第3種粉末消火剤について、正しいものはどれか。",o:["主成分は炭酸水素ナトリウムで白色","主成分はりん酸塩類で淡紅色、普通火災にも適応する","主成分は炭酸水素カリウムで紫色","炭酸水素カリウムと尿素の反応物で灰色"],a:1,e:"第1種：炭酸水素ナトリウム（白）、第2種：炭酸水素カリウム（紫系）、第3種：りん酸塩類（淡紅色）、第4種：炭酸水素カリウムと尿素の反応物（ねずみ色）。A火災にも使えるのは第3種のみ。"},
{id:"sm4",g:"sm",q:"高圧式の二酸化炭素貯蔵容器の充てん比として、正しいものはどれか。",o:["1.1以上1.4以下","1.5以上1.9以下","1.9以上2.5以下","0.9以上1.6以下"],a:1,e:"高圧式は1.5〜1.9、低圧式は1.1〜1.4。充てん比＝容器内容積(L)÷消火剤質量(kg)。"},
{id:"sm5",g:"sm",q:"不活性ガス消火設備の貯蔵容器の設置場所として、誤っているものはどれか。",o:["防護区画以外の場所に設ける","温度40℃以下で温度変化が少ない場所に設ける","直射日光や雨水のかかるおそれが少ない場所に設ける","放出時の操作がしやすいよう防護区画内の出入口付近に設ける"],a:3,e:"貯蔵容器は防護区画以外の場所に設置する。区画内に置くと火災の影響を受け、点検・操作もできなくなる。"},
{id:"sm6",g:"sm",q:"全域放出方式の二酸化炭素消火設備で、放出用スイッチ等の作動から容器弁等が開放されるまでの遅延時間はどれか。",o:["10秒以上","20秒以上","30秒以上","60秒以上"],a:1,e:"区画内の人が避難する時間を確保するため、20秒以上の遅延装置を設ける。"},
{id:"sm7",g:"sm",q:"全域放出方式のハロン1301消火設備の基準として、正しいものはどれか。",o:["噴射ヘッドの放射圧力0.9MPa以上、放射時間30秒以内","噴射ヘッドの放射圧力1.4MPa以上、放射時間1分以内","噴射ヘッドの放射圧力0.1MPa以上、放射時間30秒以内","噴射ヘッドの放射圧力0.2MPa以上、放射時間3.5分以内"],a:0,e:"ハロン1301：0.9MPa以上・30秒以内。ハロン2402は0.1MPa、1211は0.2MPa。"},
{id:"sm8",g:"sm",q:"加圧式粉末消火設備で、加圧用ガスに窒素を用いる場合の必要量はどれか（温度35℃・0Paの状態に換算）。",o:["消火剤1kgにつき10L以上","消火剤1kgにつき20L以上","消火剤1kgにつき40L以上","消火剤1kgにつき60L以上"],a:2,e:"加圧用窒素は40L/kg以上。蓄圧用窒素は10L/kg以上。二酸化炭素を使う場合はどちらも20g/kg＋クリーニングに必要な量。"},
{id:"sm9",g:"sm",q:"低圧式の二酸化炭素貯蔵容器について、正しいものはどれか。",o:["常温で貯蔵し、圧力計のみを設ければよい","−18℃以下の温度を保持する自動冷凍機を設け、2.3MPa以上又は1.9MPa以下で作動する圧力警報装置を設ける","−40℃以下を保持し、液面計は不要である","充てん比は1.5以上1.9以下とする"],a:1,e:"低圧式は−18℃以下に保つ自動冷凍機、圧力警報装置（2.3MPa以上・1.9MPa以下で警報）、液面計、圧力計を設ける。充てん比は1.1〜1.4。"},
{id:"sm10",g:"sm",q:"全域放出方式の二酸化炭素消火設備で、通信機器室の消火剤の放射時間として、正しいものはどれか。",o:["30秒以内","1分以内","3.5分以内","7分以内"],a:2,e:"二酸化炭素の全域放出：通信機器室3.5分以内、指定可燃物を貯蔵する部分7分以内、その他1分以内。"},
{id:"sm11",g:"sm",q:"窒素・IG-55・IG-541を放射する全域放出方式の不活性ガス消火設備の放射時間として、正しいものはどれか。",o:["消火剤の量の10分の9以上を1分以内","消火剤の全量を30秒以内","消火剤の全量を3.5分以内","消火剤の量の2分の1以上を10秒以内"],a:0,e:"窒素・IG-55・IG-541は、消火剤量の10分の9以上を1分以内に放射する。"},
{id:"sm12",g:"sm",q:"全域放出方式の粉末消火設備の噴射ヘッドの基準として、正しいものはどれか。",o:["放射圧力0.9MPa以上、放射時間1分以内","放射圧力1.4MPa以上、放射時間30秒以内","放射圧力0.1MPa以上、放射時間3.5分以内","放射圧力0.1MPa以上、放射時間30秒以内"],a:3,e:"粉末：放射圧力0.1MPa以上、30秒以内に放射。"},
{id:"sm13",g:"sm",q:"粉末消火設備のクリーニング装置の目的として、正しいものはどれか。",o:["貯蔵容器内の消火剤の固化を防ぐため常時かくはんする","消火剤放射後に配管内に残留した消火剤を排出する","噴射ヘッドの外面の汚れを除去する","加圧用ガスの水分を除去する"],a:1,e:"放射後に配管内に粉末が残ると固化して詰まりの原因になるため、クリーニング用ガスで排出する。"},
{id:"sm14",g:"sm",q:"加圧式粉末消火設備の定圧作動装置の役割として、正しいものはどれか。",o:["加圧用ガス容器の容器弁を開放する","貯蔵容器内の圧力が設定圧力に達したときに放出弁を開放させる","放射後に配管内をクリーニングする","貯蔵容器の過圧を外部に逃がす"],a:1,e:"加圧用ガスで貯蔵容器内の圧力が所定の値に達してから放出弁を開くことで、粉末を十分に流動化させて放射する。"},
{id:"sm15",g:"sm",q:"移動式の不活性ガス（二酸化炭素）消火設備で、防護対象物の各部分からホース接続口までの水平距離として、正しいものはどれか。",o:["15m以下","20m以下","25m以下","30m以下"],a:0,e:"移動式の水平距離は、二酸化炭素・粉末が15m以下、ハロゲン化物が20m以下。"},
{id:"sm16",g:"sm",q:"全域放出方式の二酸化炭素消火設備の閉止弁について、正しいものはどれか。",o:["噴射ヘッドの直前に設け、常時閉止しておく","防護区画内に設け、在室者が手動で閉止する","起動用ガス容器と電磁開放器の間に設ける","貯蔵容器と選択弁等の間の集合管等に設け、点検時などに閉止して誤放出による事故を防ぐ"],a:3,e:"閉止弁は貯蔵容器と選択弁等の間に設け、通常は開。点検・整備時に閉止して、誤って放出されても防護区画へ流れないようにする。"},
{id:"sm17",g:"sm",q:"全域放出方式のハロン1301消火設備の消火剤量（防護区画の体積1m³あたり）として、正しいものはどれか。",o:["0.32kg","0.40kg","0.52kg","1.2kg"],a:0,e:"ハロン1301は0.32kg/m³、ハロン1211は0.36kg/m³、ハロン2402は0.40kg/m³。二酸化炭素の通信機器室は1.2kg/m³。"},
{id:"sm18",g:"sm",q:"全域放出方式の二酸化炭素消火設備の防護区画の開口部について、正しいものはどれか。",o:["階段室や非常用エレベーターの乗降ロビーに面して開口部を設けてもよい","開口部は常に開放しておき、排出措置を兼ねる","床面からの高さが階高の3分の2以下の位置にある開口部で、消火効果を減ずるおそれのあるものには、放射前に閉鎖できる自動閉鎖装置を設ける","自動閉鎖装置は消火剤の放射後5分以内に閉鎖すればよい"],a:2,e:"階段室・非常用エレベーターの乗降ロビー等に面して開口部を設けてはならない。低い位置の開口部は消火剤が流出しやすいため、放射前に自動閉鎖させる。"},
{id:"sm19",g:"sm",q:"局所放出方式の二酸化炭素消火設備の放射時間として、正しいものはどれか。",o:["30秒以内","1分以内","3.5分以内","7分以内"],a:0,e:"局所放出方式は30秒以内に放射する。"},
{id:"sm20",g:"sm",q:"全域放出方式の消火設備で、放射された消火剤及び燃焼ガスについて講じる措置として、正しいものはどれか。",o:["防護区画内に滞留させて再燃を防ぐ","安全な場所に排出するための措置を講じる","消防隊到着後に窓を開ければよく、措置は不要である","隣接する防護区画へ排出する"],a:1,e:"放射された消火剤や燃焼ガスは、安全な場所に排出するための措置を講じる。"},
// ── 構造・機能 電気 ──
{id:"se1",g:"se",q:"火災感知器と連動する自動式の起動装置について、正しいものはどれか。",o:["1つの感知器が作動した時点で直ちに放出する","複数の火災信号を受信した場合に起動する","受信機の地区音響が鳴動してから10分後に起動する","感知器の作動とは関係なく、一定時間ごとに起動する"],a:1,e:"誤放出を防ぐため、複数の火災信号（2回線のAND）を受信して起動する。"},
{id:"se2",g:"se",q:"不活性ガス消火設備の非常電源の容量として、正しいものはどれか。",o:["10分以上","30分以上","1時間以上","2時間以上"],a:2,e:"不活性ガス・ハロゲン化物・粉末消火設備の非常電源は、1時間以上有効に作動できる容量。"},
{id:"se3",g:"se",q:"自動手動切替装置について、正しいものはどれか。",o:["誰でも容易に切り替えられるスイッチとする","防護区画内に設置する","かぎ等によらなければ切り替えられない構造とする","切替は受信機側でのみ行う"],a:2,e:"いたずらや誤操作を防ぐため、かぎ等を使わないと切り替えられないこと。自動・手動の表示も必要。"},
{id:"se4",g:"se",q:"手動起動装置の放出用スイッチについて、正しいものはどれか。",o:["音響警報装置を起動する操作を行った後でなければ操作できないこと","音響警報装置とは独立して、いつでも操作できること","防護区画内に設けること","放出用スイッチを押すと遅延なく直ちに放出されること"],a:0,e:"放出用スイッチは、先に音響警報装置を起動させた後でなければ操作できない構造とする。全域放出方式では遅延装置も必要。"},
{id:"se5",g:"se",q:"制御盤からの電気信号で作動し、起動用ガス容器の封板を破って起動用ガスを放出させる機器はどれか。",o:["圧力スイッチ","定圧作動装置","逆止弁","電磁開放器（ソレノイド）"],a:3,e:"電磁開放器は電気信号で作動し、ニードルで起動用ガス容器の封板を破る。点検時は取り外すなどして誤作動を防ぐ。"},
{id:"se6",g:"se",q:"消火剤の放出時の圧力により作動し、放出表示灯を点灯させる機器はどれか。",o:["電磁開放器","選択弁","圧力スイッチ","安全装置"],a:2,e:"圧力スイッチは集合管や配管に取り付けられ、消火剤の圧力で接点が閉じて放出表示灯を点灯させる。"},
{id:"se7",g:"se",q:"対地電圧150V以下の低圧電路の絶縁抵抗値の基準として、正しいものはどれか。",o:["0.1MΩ以上","0.2MΩ以上","0.4MΩ以上","1MΩ以上"],a:0,e:"使用電圧300V以下で対地電圧150V以下は0.1MΩ以上、300V以下でその他の場合は0.2MΩ以上、300V超は0.4MΩ以上。"},
{id:"se8",g:"se",q:"音響警報装置について、正しいものはどれか。",o:["消火剤の放出が完了してから警報を発する","手動起動装置の操作又は火災感知器の作動と連動して自動的に警報を発する","警報は防護区画の外にのみ設ける","音響警報装置には非常電源は不要である"],a:1,e:"起動装置の操作や感知器の作動と連動して警報を発し、区画内の人を避難させる。非常電源も必要。"},
{id:"se9",g:"se",q:"使用電圧300V以下の低圧機器の金属製外箱に施す接地工事の種類として、正しいものはどれか。",o:["A種接地工事","B種接地工事","C種接地工事","D種接地工事"],a:3,e:"300V以下の低圧機器の外箱はD種（接地抵抗100Ω以下）。300V超の低圧はC種。"},
// ── 規格 ──
{id:"ks1",g:"ks",q:"選択弁の基準として、誤っているものはどれか。",o:["防護区画ごとに設ける","防護区画以外の場所に設ける","「選択弁」である旨及びいずれの防護区画の選択弁であるかを表示する","貯蔵容器を共用しない場合でも、必ず防護区画内に予備の選択弁を設ける"],a:3,e:"選択弁は1つの貯蔵容器を複数の防護区画で共用するときに区画ごとに設けるもので、防護区画以外の場所に置く。"},
{id:"ks2",g:"ks",q:"高圧式の二酸化炭素消火設備（全域放出方式）の噴射ヘッドの放射圧力として、正しいものはどれか。",o:["0.9MPa以上","1.1MPa以上","1.4MPa以上","2.0MPa以上"],a:2,e:"高圧式1.4MPa以上、低圧式0.9MPa以上。"},
{id:"ks3",g:"ks",q:"不活性ガス消火設備の起動用ガス容器の基準として、正しい組合せはどれか。",o:["内容積0.5L以上、二酸化炭素0.3kg以上","内容積1L以上、二酸化炭素0.6kg以上、充てん比1.5以上","内容積2L以上、二酸化炭素1.0kg以上、充てん比1.1以上","内容積1L以上、窒素0.6kg以上、充てん比1.9以上"],a:1,e:"起動用ガス容器は内容積1L以上、二酸化炭素の量0.6kg以上、充てん比1.5以上。"},
{id:"ks4",g:"ks",q:"高圧式の二酸化炭素消火設備の配管に鋼管を用いる場合の基準として、正しいものはどれか。",o:["圧力配管用炭素鋼鋼管（STPG370）で、防食処理を施したスケジュール80以上のもの","配管用炭素鋼鋼管（SGP）であればよい","圧力配管用炭素鋼鋼管のスケジュール40以上のもの","ステンレス鋼管に限る"],a:0,e:"高圧式はSTPG370のスケジュール80以上、低圧式はスケジュール40以上（いずれも亜鉛めっき等の防食処理）。"},
{id:"ks5",g:"ks",q:"選択弁の開放時期について、正しいものはどれか。",o:["容器弁が開放されてから30秒後に開放する","貯蔵容器の容器弁又は放出弁の開放前又は同時に開放する","消火剤の放射が終わってから開放する","選択弁は常時開放しておく"],a:1,e:"選択弁が閉じたまま容器弁が開くと配管内が過圧になるため、容器弁等の開放前又は同時に開放する。"},
{id:"ks6",g:"ks",q:"起動用ガス容器が耐えなければならない圧力として、正しいものはどれか。",o:["10MPa以上","15MPa以上","24.5MPa以上","30MPa以上"],a:2,e:"起動用ガス容器は24.5MPa以上の圧力に耐えるもの。"},
{id:"ks7",g:"ks",q:"低圧式の二酸化炭素消火設備（全域放出方式）の噴射ヘッドの放射圧力として、正しいものはどれか。",o:["0.1MPa以上","0.9MPa以上","1.4MPa以上","2.3MPa以上"],a:1,e:"低圧式0.9MPa以上、高圧式1.4MPa以上。"},
{id:"ks8",g:"ks",q:"全域放出方式の噴射ヘッドについて、正しいものはどれか。",o:["放射された消火剤が防護区画の全域に均一かつ速やかに拡散するように設ける","防護対象物の表面を直接狙う位置に限り設ける","天井から1m以上下げて設けなければならない","1つの防護区画に1個に限り設ける"],a:0,e:"全域放出方式は区画全体の濃度を上げて消火するため、全域に均一かつ速やかに拡散するように設ける。防護対象物を直接狙うのは局所放出方式。"},
// ===== 追加分 =====
// 法令 共通
{id:"lc15",g:"lc",q:"消防法に定める「関係者」に含まれないものはどれか。",o:["所有者","管理者","占有者","設計者"],a:3,e:"関係者とは、防火対象物又は消防対象物の所有者・管理者・占有者をいう。"},
{id:"lc16",g:"lc",q:"次のうち、特定防火対象物に該当するものはどれか。",o:["小学校","図書館","事務所","幼稚園"],a:3,e:"幼稚園や特別支援学校（令別表第一6項ニ）は特定防火対象物。小学校・図書館・事務所は非特定。"},
{id:"lc17",g:"lc",q:"次のうち、特定防火対象物に該当するものはどれか。",o:["地下街","共同住宅","工場","倉庫"],a:0,e:"地下街（16の2項）は特定防火対象物。特定用途を含む複合用途防火対象物（16項イ）も特定。"},
{id:"lc18",g:"lc",q:"消防設備士免状を交付する者として、正しいものはどれか。",o:["消防長","総務大臣","都道府県知事","市町村長"],a:2,e:"免状は試験に合格した者に都道府県知事が交付する。"},
{id:"lc19",g:"lc",q:"消防設備士免状について、正しいものはどれか。",o:["交付を受けた都道府県内でのみ有効である","全国どこでも有効である","5年ごとに更新しなければならない","乙種の免状でも工事を行うことができる"],a:1,e:"免状は全国で有効。更新制度はなく、代わりに定期的な講習の受講義務がある。乙種は整備のみ。"},
{id:"lc20",g:"lc",q:"免状の交付を行わないことができる者として、正しいものはどれか。",o:["免状の返納を命じられた日から1年を経過しない者","免状の返納を命じられた日から3年を経過しない者","過去に免状を亡失したことがある者","講習を一度でも受講しなかった者"],a:0,e:"返納を命じられた日から1年を経過しない者や、消防法令違反で罰金以上の刑に処せられ執行を終わるなどした日から2年を経過しない者には、交付を行わないことができる。"},
{id:"lc21",g:"lc",q:"免状の再交付を申請する先として、正しいものはどれか。",o:["免状の交付又は書換えをした都道府県知事","居住地を管轄する消防長","勤務地を管轄する市町村長","総務大臣"],a:0,e:"再交付は、免状の交付又は書換えをした都道府県知事に申請する。"},
{id:"lc22",g:"lc",q:"免状の書換えの申請先として、誤っているものはどれか。",o:["免状を交付した都道府県知事","居住地を管轄する都道府県知事","勤務地を管轄する都道府県知事","居住地を管轄する消防署長"],a:3,e:"書換えは、交付した都道府県知事又は居住地若しくは勤務地を管轄する都道府県知事に申請する。"},
{id:"lc23",g:"lc",q:"消防用設備等の点検の期間の組合せとして、正しいものはどれか。",o:["機器点検1年に1回／総合点検3年に1回","機器点検6か月に1回／総合点検1年に1回","機器点検3か月に1回／総合点検6か月に1回","機器点検6か月に1回／総合点検3年に1回"],a:1,e:"機器点検は6か月に1回、総合点検は1年に1回。報告の期間（特定1年・非特定3年）とは別。"},
{id:"lc24",g:"lc",q:"消防用設備等を設置し、維持しなければならない者として、正しいものはどれか。",o:["消防設備士","防火対象物の関係者","消防長又は消防署長","防火管理者"],a:1,e:"設置・維持の義務を負うのは関係者（所有者・管理者・占有者）。"},
{id:"lc25",g:"lc",q:"防火管理者を定めなければならない防火対象物として、正しいものはどれか（6項ロなどを除く）。",o:["特定防火対象物で収容人員30人以上","特定防火対象物で収容人員50人以上","非特定防火対象物で収容人員30人以上","すべての防火対象物で収容人員10人以上"],a:0,e:"特定防火対象物は30人以上、非特定は50人以上。要介護者の入所施設など（6項ロ等）は10人以上。"},
{id:"lc26",g:"lc",q:"防火対象物の用途を変更した場合に、変更後の用途の基準に適合させなければならないものはどれか。",o:["変更後の用途が特定防火対象物である場合","変更後の用途が共同住宅である場合","床面積を変えない場合はいずれも不要","事務所から工場へ変更した場合"],a:0,e:"用途変更では原則として変更前の基準のままでよいが、変更後が特定防火対象物となる場合は変更後の基準に適合させる。"},
{id:"lc27",g:"lc",q:"既存の防火対象物で、改正後の基準に適合させなければならない増改築の規模として、正しいものはどれか。",o:["床面積の合計1,000m²以上又は延べ面積の2分の1以上","床面積の合計500m²以上","延べ面積の3分の1以上","増改築では基準の適用はない"],a:0,e:"基準改正後の増改築で、床面積の合計が1,000m²以上又は延べ面積の2分の1以上となるものは、改正後の基準に適合させる。大規模な修繕・模様替えで主要構造部の壁の過半に及ぶものも同様。"},
{id:"lc28",g:"lc",q:"消防設備士でなくても行うことができる整備（軽微な整備）に該当するものはどれか。",o:["不活性ガス消火設備の容器弁の交換","屋内消火栓設備の表示灯の交換","粉末消火設備の配管の交換","ハロゲン化物消火設備の選択弁の交換"],a:1,e:"屋内消火栓設備の表示灯の交換、ホース・ノズル・ヒューズ類・ネジ類の交換などは軽微な整備として消防設備士でなくても行える。"},
{id:"lc29",g:"lc",q:"検定対象機械器具等に該当しないものはどれか。",o:["消火器","閉鎖型スプリンクラーヘッド","火災報知設備の感知器","不活性ガス消火設備の噴射ヘッド"],a:3,e:"検定対象は消火器、消火器用消火薬剤、泡消火薬剤、感知器、発信機、受信機、中継器、閉鎖型スプリンクラーヘッド、流水検知装置、一斉開放弁、金属製避難はしご、緩降機など。"},
// 法令 類別
{id:"lk10",g:"lk",q:"1階にある駐車の用に供される部分で、水噴霧・泡・不活性ガス等の設置が必要となる床面積はどれか。",o:["200m²以上","300m²以上","400m²以上","500m²以上"],a:3,e:"1階は500m²以上。地階・2階以上は200m²以上、屋上部分は300m²以上。"},
{id:"lk11",g:"lk",q:"発電機・変圧器などの電気設備が設置されている部分で、不活性ガス・ハロゲン化物・粉末消火設備のいずれかの設置が必要となる床面積はどれか。",o:["100m²以上","200m²以上","300m²以上","500m²以上"],a:1,e:"電気設備の部分は200m²以上。"},
{id:"lk12",g:"lk",q:"乙種第3類消防設備士が行うことができないものはどれか。",o:["ハロゲン化物消火設備の点検","粉末消火設備の整備","不活性ガス消火設備の点検","不活性ガス消火設備の新設工事"],a:3,e:"工事は甲種の業務。乙種は整備と点検のみ。"},
{id:"lk13",g:"lk",q:"甲種第3類消防設備士が工事を行うことができる設備はどれか。",o:["泡消火設備","不活性ガス消火設備","スプリンクラー設備","屋外消火栓設備"],a:1,e:"第3類は不活性ガス・ハロゲン化物・粉末消火設備。泡は第2類、スプリンクラー・屋外消火栓は第1類。"},
{id:"lk14",g:"lk",q:"ボイラー室など多量の火気を使用する部分（床面積200m²以上）に設置できる消火設備はどれか。",o:["泡消火設備","水噴霧消火設備","粉末消火設備","スプリンクラー設備"],a:2,e:"多量の火気を使用する部分は、不活性ガス・ハロゲン化物・粉末消火設備のいずれか。"},
{id:"lk15",g:"lk",q:"通信機器室（床面積500m²以上）に設置できる消火設備はどれか。",o:["泡消火設備","水噴霧消火設備","ハロゲン化物消火設備","スプリンクラー設備"],a:2,e:"通信機器室は不活性ガス・ハロゲン化物・粉末消火設備のいずれか。水や泡は機器を損傷する。"},
{id:"lk16",g:"lk",q:"駐車の用に供される部分（地階で床面積200m²以上）に設置する消火設備として、令第13条に定められていないものはどれか。",o:["水噴霧消火設備","泡消火設備","粉末消火設備","屋内消火栓設備"],a:3,e:"駐車の用に供される部分は、水噴霧・泡・不活性ガス・ハロゲン化物・粉末消火設備のいずれか。"},
// 基礎 機械
{id:"bm9",g:"bm",q:"温度一定のもとで、絶対圧力0.2MPa・体積6Lの気体を2Lに圧縮した。絶対圧力はいくらか。",o:["0.067MPa","0.4MPa","0.6MPa","1.2MPa"],a:2,e:"ボイルの法則 P₁V₁＝P₂V₂。0.2×6＝P₂×2 → P₂＝0.6MPa。"},
{id:"bm10",g:"bm",q:"長さ2mの棒を引っ張ったところ1mm伸びた。ひずみはいくらか。",o:["0.0005","0.005","0.002","0.05"],a:0,e:"ひずみ＝伸び÷元の長さ＝1mm÷2,000mm＝0.0005。単位をそろえることが大切。"},
{id:"bm11",g:"bm",q:"フックの法則について、正しいものはどれか。",o:["弾性限度内では応力はひずみに反比例する","弾性限度内では応力はひずみに比例する","応力はひずみの2乗に比例する","応力とひずみは無関係である"],a:1,e:"弾性限度（比例限度）内では応力とひずみは比例する。比例定数が縦弾性係数（ヤング率）。"},
{id:"bm12",g:"bm",q:"応力200N/mm²のとき、ひずみが0.001であった。縦弾性係数はいくらか。",o:["2,000N/mm²","20,000N/mm²","200,000N/mm²","0.2N/mm²"],a:2,e:"縦弾性係数＝応力÷ひずみ＝200÷0.001＝200,000N/mm²（鋼はおよそこの値）。"},
{id:"bm13",g:"bm",q:"軟鋼の応力-ひずみ線図で、材料が耐えられる最大の応力を何というか。",o:["比例限度","弾性限度","降伏点","引張強さ（極限強さ）"],a:3,e:"応力の小さい順に、比例限度→弾性限度→降伏点→引張強さ（最大応力）→破断。"},
{id:"bm14",g:"bm",q:"青銅の主成分の組合せとして、正しいものはどれか。",o:["銅と亜鉛","銅とすず","鉄とニッケル","銅とアルミニウム"],a:1,e:"青銅＝銅＋すず。黄銅＝銅＋亜鉛。"},
{id:"bm15",g:"bm",q:"ステンレス鋼が腐食しにくいのは、鉄に主として何を加えているためか。",o:["炭素","クロム","鉛","亜鉛"],a:1,e:"クロム（とニッケル）を加えることで表面に不動態皮膜ができ、さびにくくなる。"},
{id:"bm16",g:"bm",q:"鋳鉄と炭素鋼の比較として、正しいものはどれか。",o:["鋳鉄は炭素鋼より炭素量が多く、もろい","鋳鉄は炭素鋼より炭素量が少なく、粘り強い","鋳鉄と炭素鋼の炭素量は同じである","鋳鉄は炭素を含まない"],a:0,e:"鋳鉄は炭素量がおよそ2%以上と多く、鋳造しやすいがもろい。"},
{id:"bm17",g:"bm",q:"1MPaを Pa で表したものとして、正しいものはどれか。",o:["1,000Pa","10,000Pa","100,000Pa","1,000,000Pa"],a:3,e:"1MPa＝1,000kPa＝1,000,000Pa。1Pa＝1N/m²、1MPa＝1N/mm²。"},
{id:"bm18",g:"bm",q:"ピッチ1.5mmの2条ねじを1回転させたときに進む距離（リード）はいくらか。",o:["0.75mm","1.5mm","3mm","4.5mm"],a:2,e:"リード＝条数×ピッチ＝2×1.5＝3mm。"},
{id:"bm19",g:"bm",q:"圧力一定のもとで、27℃で3Lの気体を127℃にすると体積はいくらになるか。",o:["3.5L","4L","9.4L","6L"],a:1,e:"シャルルの法則 V/T 一定。3×(400÷300)＝4L。"},
{id:"bm20",g:"bm",q:"摩擦係数0.3の床面上で、垂直力100Nがかかっている物体を動かすのに必要な力（最大静止摩擦力）はいくらか。",o:["3N","30N","300N","0.3N"],a:1,e:"摩擦力＝摩擦係数×垂直力＝0.3×100＝30N。"},
{id:"bm21",g:"bm",q:"物体に50Nの力を加えて、力の向きに4m動かした。仕事はいくらか。",o:["12.5J","54J","200J","2,000J"],a:2,e:"仕事＝力×距離＝50×4＝200J（N·m）。"},
{id:"bm22",g:"bm",q:"600Jの仕事を10秒間で行ったときの動力（仕事率）はいくらか。",o:["6W","60W","610W","6,000W"],a:1,e:"動力＝仕事÷時間＝600÷10＝60W（J/s）。"},
{id:"bm23",g:"bm",q:"鋼の熱処理で「焼入れ」の目的として、正しいものはどれか。",o:["軟らかくして加工しやすくする","硬さと強さを増す","内部応力を除去する","組織を標準状態に戻す"],a:1,e:"焼入れは高温から急冷して硬さを増す。もろくなるので焼戻しで粘り強さを与える。"},
{id:"bm24",g:"bm",q:"はんだの主成分として、正しいものはどれか（鉛フリーはんだを除く）。",o:["すずと鉛","銅と亜鉛","アルミニウムとマグネシウム","鉄とクロム"],a:0,e:"一般的なはんだはすずと鉛の合金で、融点が低い。"},
// 基礎 電気
{id:"be7",g:"be",q:"20Ωの抵抗に5Aの電流が流れている。抵抗の両端の電圧はいくらか。",o:["4V","25V","100V","400V"],a:2,e:"V＝IR＝5×20＝100V。"},
{id:"be8",g:"be",q:"10Ωと20Ωの抵抗を直列につなぎ、30Vを加えた。20Ωの抵抗の両端の電圧はいくらか。",o:["10V","15V","20V","30V"],a:2,e:"合成30Ω、電流1A。20Ωの電圧＝1×20＝20V。直列では電圧は抵抗に比例して分かれる。"},
{id:"be9",g:"be",q:"10Ωの抵抗に2Aの電流が流れているときの消費電力はいくらか。",o:["20W","40W","80W","200W"],a:1,e:"P＝I²R＝2²×10＝40W。"},
{id:"be10",g:"be",q:"30Ωの抵抗を3個並列に接続したときの合成抵抗はいくらか。",o:["10Ω","30Ω","90Ω","3.3Ω"],a:0,e:"同じ抵抗n個の並列は R÷n＝30÷3＝10Ω。"},
{id:"be11",g:"be",q:"抵抗に流れる電流を2倍にすると、一定時間に発生する熱量は何倍になるか。",o:["2倍","4倍","1/2倍","変わらない"],a:1,e:"ジュール熱 Q＝I²Rt。電流2倍で4倍。"},
{id:"be12",g:"be",q:"交流回路で周波数を高くしたときの変化として、正しいものはどれか。",o:["コイルの誘導リアクタンスは小さくなる","コンデンサの容量リアクタンスは小さくなる","抵抗の値が大きくなる","コンデンサの容量リアクタンスは大きくなる"],a:1,e:"誘導リアクタンス XL＝2πfL は周波数に比例、容量リアクタンス XC＝1/(2πfC) は反比例。"},
{id:"be13",g:"be",q:"電圧100V、電流10A、力率0.8の単相交流回路の有効電力はいくらか。",o:["1,000W","800W","1,250W","80W"],a:1,e:"有効電力＝VIcosθ＝100×10×0.8＝800W。皮相電力は1,000VA。"},
{id:"be14",g:"be",q:"一次巻数1,000回、二次巻数50回の変圧器の一次側に100Vを加えた。二次側の電圧はいくらか。",o:["5V","20V","50V","200V"],a:0,e:"電圧は巻数に比例。100×50÷1,000＝5V。"},
{id:"be15",g:"be",q:"直流専用の指示電気計器はどれか。",o:["可動鉄片形","可動コイル形","誘導形","整流形"],a:1,e:"可動コイル形は直流用。可動鉄片形・誘導形・整流形は交流用。"},
{id:"be16",g:"be",q:"次の金属のうち、抵抗率が最も小さいものはどれか。",o:["鉄","アルミニウム","銀","銅"],a:2,e:"抵抗率は 銀＜銅＜金＜アルミニウム＜鉄 の順に大きくなる。"},
// 構造・機能 機械
{id:"sm21",g:"sm",q:"常温・常圧で液体のハロゲン化物消火剤はどれか。",o:["ハロン1301","ハロン1211","ハロン2402","二酸化炭素"],a:2,e:"ハロン2402は常温で液体。ハロン1301・1211は常温で気体（加圧すると液化）。"},
{id:"sm22",g:"sm",q:"全域放出方式のハロン2402消火設備の噴射ヘッドの放射圧力として、正しいものはどれか。",o:["0.1MPa以上","0.2MPa以上","0.9MPa以上","1.4MPa以上"],a:0,e:"ハロン2402は0.1MPa以上、ハロン1211は0.2MPa以上、ハロン1301は0.9MPa以上。"},
{id:"sm23",g:"sm",q:"二酸化炭素の性質として、誤っているものはどれか。",o:["無色・無臭の気体である","電気絶縁性がある","空気より軽く、天井付近に滞留する","高濃度では人命に危険がある"],a:2,e:"二酸化炭素は空気の約1.5倍の重さで、低い所に滞留する。地下や低所への流入に注意する。"},
{id:"sm24",g:"sm",q:"IG-541の組成として、正しいものはどれか。",o:["窒素100%","窒素50%・アルゴン50%","窒素52%・アルゴン40%・二酸化炭素8%","アルゴン100%"],a:2,e:"IG-541は窒素・アルゴン・二酸化炭素の混合。IG-55は窒素とアルゴン各50%。"},
{id:"sm25",g:"sm",q:"ハロゲン化物消火剤に該当しないものはどれか。",o:["HFC-227ea","HFC-23","FK-5-1-12","IG-541"],a:3,e:"IG-541は不活性ガス消火剤。HFC-227ea・HFC-23・FK-5-1-12はハロン代替のハロゲン化物消火剤。"},
{id:"sm26",g:"sm",q:"ハロゲン化物消火剤の主な消火作用はどれか。",o:["冷却作用","窒息作用","負触媒（抑制）作用","希釈作用"],a:2,e:"燃焼の連鎖反応を断ち切る負触媒（抑制）作用が主体。"},
{id:"sm27",g:"sm",q:"粉末消火剤について、正しいものはどれか。",o:["吸湿しやすいため、シリコーン樹脂などで防湿処理をしている","水に溶かして使用する","主な消火作用は冷却作用である","すべての種別が普通火災に適応する"],a:0,e:"粉末は防湿処理が施されている。消火作用は負触媒作用と窒息作用。普通火災に適応するのは第3種のみ。"},
{id:"sm28",g:"sm",q:"加圧式粉末消火設備で、加圧用ガスに二酸化炭素を用いる場合の必要量として、正しいものはどれか。",o:["消火剤1kgにつき10g以上","消火剤1kgにつき20g以上にクリーニングに必要な量を加えた量","消火剤1kgにつき40L以上","消火剤1kgにつき100g以上"],a:1,e:"二酸化炭素は20g/kg＋クリーニング量（加圧用・蓄圧用とも）。窒素は加圧用40L/kg、蓄圧用10L/kg。"},
{id:"sm29",g:"sm",q:"蓄圧式粉末消火設備で、蓄圧用ガスに窒素を用いる場合の必要量として、正しいものはどれか。",o:["消火剤1kgにつき10L以上","消火剤1kgにつき20L以上","消火剤1kgにつき40L以上","消火剤1kgにつき60L以上"],a:0,e:"蓄圧用窒素は10L/kg以上（35℃・0Pa換算）。加圧用は40L/kg以上。"},
{id:"sm30",g:"sm",q:"全域放出方式の第3種粉末消火設備の消火剤量（防護区画の体積1m³あたり）として、正しいものはどれか。",o:["0.24kg","0.36kg","0.60kg","1.2kg"],a:1,e:"第1種0.60kg、第2種・第3種0.36kg、第4種0.24kg（いずれも1m³あたり）。"},
{id:"sm31",g:"sm",q:"移動式の二酸化炭素消火設備の基準として、正しいものはどれか。",o:["1のノズルにつき90kg以上の消火剤を貯蔵し、毎分60kg以上を放射できる","1のノズルにつき45kg以上を貯蔵し、毎分35kg以上を放射できる","1のノズルにつき30kg以上を貯蔵し、毎分27kg以上を放射できる","1のノズルにつき200kg以上を貯蔵する"],a:0,e:"移動式二酸化炭素は1ノズルあたり90kg以上、放射量は毎分60kg以上。"},
{id:"sm32",g:"sm",q:"移動式の不活性ガス・ハロゲン化物・粉末消火設備を設置できる場所として、正しいものはどれか。",o:["火災のとき煙が著しく充満するおそれのない場所","常時人がいない地下の機械室","密閉された電気室","火災のとき煙が充満しやすい場所"],a:0,e:"移動式は人がホースを持って操作するため、煙が著しく充満するおそれのない場所に限られる。"},
{id:"sm33",g:"sm",q:"全域放出方式の二酸化炭素消火設備で、通信機器室の消火剤量（防護区画の体積1m³あたり）として、正しいものはどれか。",o:["0.32kg","0.60kg","0.80kg","1.2kg"],a:3,e:"通信機器室は1.2kg/m³。"},
{id:"sm34",g:"sm",q:"ハロン1301の貯蔵容器の充てん比として、正しいものはどれか。",o:["0.9以上1.6以下","1.5以上1.9以下","1.1以上1.4以下","0.51以上0.67以下"],a:0,e:"ハロン1301は0.9〜1.6。二酸化炭素の高圧式は1.5〜1.9、低圧式は1.1〜1.4。"},
{id:"sm35",g:"sm",q:"高圧式二酸化炭素消火設備の容器弁と集合管を結ぶ連結管に設ける逆止弁の目的として、正しいものはどれか。",o:["集合管から空の容器や取り外した容器の側へ消火剤が逆流するのを防ぐ","防護区画の空気が配管に入るのを防ぐ","消火剤の放射量を調整する","起動用ガスを選択弁に導く"],a:0,e:"逆止弁は、一部の容器を外したときや放出時に、集合管内の消火剤が他の容器側へ逆流しないようにする。"},
{id:"sm36",g:"sm",q:"全域放出方式の二酸化炭素消火設備の保安措置として、誤っているものはどれか。",o:["防護区画の出入口の見やすい箇所に放出表示灯を設ける","防護区画の出入口付近に注意銘板を設ける","起動から放出までに遅延装置を設ける","放射された消火剤は区画内に密閉したまま放置する"],a:3,e:"放射された消火剤や燃焼ガスは安全な場所に排出する措置を講じる。"},
{id:"sm37",g:"sm",q:"局所放出方式の説明として、正しいものはどれか。",o:["防護区画全体を消火剤で満たして消火する","防護対象物に直接消火剤を放射して消火する","人がホース・ノズルを操作して消火する","スプリンクラーヘッドから水を放射する"],a:1,e:"全域放出＝区画全体、局所放出＝対象物に直接、移動式＝人がホースで操作。"},
{id:"sm38",g:"sm",q:"局所放出方式の噴射ヘッドの設置について、正しいものはどれか。",o:["消火剤の放射によって可燃物が飛び散らない箇所に設ける","防護対象物から最も遠い天井面に設ける","消火剤が防護区画全体に拡散するように設ける","放射圧力の基準はない"],a:0,e:"局所放出方式では、液面などの可燃物を消火剤で飛散させないように設ける。"},
{id:"sm39",g:"sm",q:"窒素・IG-55・IG-541を用いる全域放出方式の防護区画に講じる措置として、正しいものはどれか。",o:["放射時の過度の圧力上昇を防ぐ避圧口などを設ける","防護区画の壁は可燃材料でもよい","放出表示灯は不要である","遅延装置は設けてはならない"],a:0,e:"大量のガスを短時間で放射するため、区画の損傷を防ぐ避圧口などの措置が必要。"},
{id:"sm40",g:"sm",q:"全域放出方式・局所放出方式・移動式のうち、人がホースを延長して消火する方式はどれか。",o:["全域放出方式","局所放出方式","移動式","パッケージ型の全域放出方式"],a:2,e:"移動式はホース・ノズルを人が操作する。ホース接続口から防護対象物の各部分までの水平距離は、二酸化炭素・粉末で15m以下、ハロゲン化物で20m以下。"},
{id:"sm41",g:"sm",q:"第1種粉末消火剤が適応する火災の組合せとして、正しいものはどれか。",o:["普通火災・油火災・電気火災","油火災・電気火災","普通火災のみ","普通火災・電気火災"],a:1,e:"第1・2・4種はB（油）・C（電気）火災。第3種のみA・B・Cすべてに適応。"},
// 構造・機能 電気
{id:"se10",g:"se",q:"絶縁抵抗の測定に用いる計器はどれか。",o:["回路計","絶縁抵抗計","接地抵抗計","検電器"],a:1,e:"絶縁抵抗計（メガー）で測定する。接地抵抗は接地抵抗計、導通や電圧は回路計。"},
{id:"se11",g:"se",q:"D種接地工事の接地抵抗値として、正しいものはどれか（地絡時に自動遮断する装置がない場合）。",o:["10Ω以下","100Ω以下","500Ω以下","1,000Ω以下"],a:1,e:"D種は100Ω以下（0.5秒以内に自動遮断する装置がある場合は500Ω以下）。C種は10Ω以下。"},
{id:"se12",g:"se",q:"配線の導通（断線の有無）を確認するのに適した計器はどれか。",o:["回路計（テスター）","絶縁抵抗計","騒音計","風速計"],a:0,e:"導通試験は回路計の抵抗レンジなどで行う。"},
{id:"se13",g:"se",q:"使用電圧300Vを超える低圧電路の絶縁抵抗値の基準として、正しいものはどれか。",o:["0.1MΩ以上","0.2MΩ以上","0.4MΩ以上","1MΩ以上"],a:2,e:"300V超は0.4MΩ以上。300V以下で対地電圧150V以下は0.1MΩ以上、その他は0.2MΩ以上。"},
{id:"se14",g:"se",q:"全域放出方式の音響警報装置について、正しいものはどれか。",o:["消火剤の放射前に遮断されないものとする","消火剤の放射開始と同時に自動停止する","警報は手動でのみ鳴らす","防護区画の外にだけ設ける"],a:0,e:"区画内の人が確実に避難できるよう、放射前に警報が遮断されないものとする。全域放出方式は音声による警報とする。"},
{id:"se15",g:"se",q:"不活性ガス消火設備の手動起動装置の表示として、正しいものはどれか。",o:["「不活性ガス消火設備の手動起動装置」である旨を表示する","表示は不要である","「非常ボタン」とだけ表示する","「放出中」と表示する"],a:0,e:"手動起動装置には、その旨の表示のほか、防護区画の名称・取扱い方法・保安上の注意事項などを表示する。"},
{id:"se16",g:"se",q:"全域放出方式の手動起動装置の設置について、正しいものはどれか。",o:["1つの防護区画ごとに設ける","複数の防護区画で1つを共用する","防護区画内の中央に設ける","床面から2m以上の高さに設ける"],a:0,e:"手動起動装置は防護区画ごとに、区画外で区画内を見通せ、出入口付近の床面から0.8〜1.5mの位置に設ける。"},
{id:"se17",g:"se",q:"手動起動装置またはその直近に表示しなければならない事項として、誤っているものはどれか。",o:["防護区画の名称","取扱い方法","保安上の注意事項","消防設備士の氏名"],a:3,e:"防護区画の名称・取扱い方法・保安上の注意事項などを表示する。"},
// 規格
{id:"ks9",g:"ks",q:"高圧式の二酸化炭素消火設備の配管に銅管を用いる場合の耐圧の基準として、正しいものはどれか。",o:["3.75MPa以上","10MPa以上","16.5MPa以上","24.5MPa以上"],a:2,e:"銅管は高圧式16.5MPa以上、低圧式3.75MPa以上の圧力に耐えるもの。"},
{id:"ks10",g:"ks",q:"低圧式の二酸化炭素消火設備の配管に鋼管を用いる場合の基準として、正しいものはどれか。",o:["STPG370のスケジュール40以上で防食処理を施したもの","SGPであればよい","STPG370のスケジュール160以上","鋼管は使用できない"],a:0,e:"低圧式はスケジュール40以上、高圧式はスケジュール80以上。"},
{id:"ks11",g:"ks",q:"加圧式粉末消火設備の加圧用ガス容器に設ける圧力調整器の基準として、正しいものはどれか。",o:["2.5MPa以下の圧力に調整できるもの","5.0MPa以下の圧力に調整できるもの","10MPa以下の圧力に調整できるもの","圧力調整器は不要"],a:0,e:"加圧用ガス容器には2.5MPa以下に調整できる圧力調整器を設ける。"},
{id:"ks12",g:"ks",q:"第3種粉末消火剤の貯蔵容器の充てん比として、正しいものはどれか。",o:["0.85以上1.45以下","1.05以上1.75以下","1.50以上2.50以下","1.5以上1.9以下"],a:1,e:"第1種0.85〜1.45、第2種・第3種1.05〜1.75、第4種1.50〜2.50。"},
{id:"ks13",g:"ks",q:"不活性ガス消火設備の配管について、正しいものはどれか。",o:["専用とする","屋内消火栓設備と兼用してよい","給水管と兼用してよい","排煙設備のダクトと兼用してよい"],a:0,e:"不活性ガス・ハロゲン化物・粉末消火設備の配管は専用とする。"},
// ===== 追加分（第3弾） =====
{id:"lc30",g:"lc",q:"消防職員に防火対象物へ立ち入らせ、検査や質問をさせることができる者として、正しいものはどれか。",o:["消防長又は消防署長","都道府県知事","総務大臣","消防庁長官"],a:0,e:"消防長又は消防署長（消防本部を置かない市町村は市町村長）が、消防職員に立入検査をさせることができる。"},
{id:"lc31",g:"lc",q:"設置届を受けた消防長等が検査を行い、基準に適合していると認めたときに交付するものはどれか。",o:["消防設備士免状","検査済証","型式承認書","点検票"],a:1,e:"検査の結果、技術上の基準に適合していると認めたときは検査済証を交付する。"},
{id:"lc32",g:"lc",q:"延べ面積にかかわらず、消防用設備等の設置届と検査が必要な防火対象物はどれか。",o:["事務所","共同住宅","カラオケボックス","工場"],a:2,e:"カラオケボックス等、旅館・ホテル等、病院・診療所（入院施設あり）、自力避難困難者の入所施設などは面積に関係なく届出・検査が必要。その他の特定防火対象物は延べ面積300m²以上。"},
{id:"lc33",g:"lc",q:"乙種消防設備士にだけある指定区分はどれか。",o:["第1類・第2類","第4類・第5類","第6類・第7類","特類"],a:2,e:"第6類（消火器）と第7類（漏電火災警報器）は乙種のみ。特類は甲種のみ。"},
{id:"lc34",g:"lc",q:"消防用設備等の技術上の基準について、特例（令第32条）の適用を認める者として、正しいものはどれか。",o:["総務大臣","都道府県知事","消防長又は消防署長","消防設備士"],a:2,e:"防火対象物の位置・構造・設備の状況から、火災の発生・延焼のおそれが著しく少ないなどと消防長又は消防署長が認めるときは、基準を適用しないことができる。"},
{id:"lc35",g:"lc",q:"市町村が条例で、政令で定める消防用設備等の基準と異なる規定を設けることができるのは、どのような場合か。",o:["市町村の財政事情による場合","関係者から要望があった場合","市内の消防設備士が不足している場合","その地方の気候又は風土の特殊性により必要な場合"],a:3,e:"その地方の気候又は風土の特殊性により、政令の基準だけでは目的を十分に達しがたいと認めるときに、条例で異なる規定を設けることができる。"},
{id:"lc36",g:"lc",q:"1つの防火対象物の部分が、消防用設備等の設置基準上、別の防火対象物とみなされる条件として、正しいものはどれか。",o:["防火戸で区画されている","所有者が異なる","開口部のない耐火構造の床又は壁で区画されている","用途が異なる"],a:2,e:"開口部のない耐火構造の床又は壁で区画されている部分は、それぞれ別の防火対象物とみなす（令第8条）。"},
{id:"lc37",g:"lc",q:"消防用設備等の点検結果を消防長等に報告する者として、正しいものはどれか。",o:["消防設備士","防火対象物の関係者","消防設備点検資格者","消防署長"],a:1,e:"点検は消防設備士等が行う場合でも、報告の義務を負うのは関係者。"},
{id:"lc38",g:"lc",q:"火災予防上危険と認める防火対象物について、改修・移転・除去などを命じることができる者として、正しいものはどれか。",o:["都道府県知事","総務大臣","消防団長","消防長又は消防署長"],a:3,e:"防火対象物の改修・移転・除去・工事の停止などの措置命令は、消防長又は消防署長が行う。"},
{id:"lc39",g:"lc",q:"乙種第6類消防設備士が整備できるものはどれか。",o:["漏電火災警報器","避難はしご","泡消火設備","消火器"],a:3,e:"第6類は消火器。第7類は漏電火災警報器、第5類は避難はしご等、第2類は泡消火設備。"},
{id:"lk17",g:"lk",q:"地階にある自動車の修理・整備の用に供される部分で、泡・不活性ガス・ハロゲン化物・粉末消火設備のいずれかの設置が必要となる床面積はどれか。",o:["100m²以上","200m²以上","300m²以上","500m²以上"],a:1,e:"自動車の修理・整備の部分は、地階又は2階以上200m²以上、1階500m²以上。"},
{id:"lk18",g:"lk",q:"1階にある自動車の修理・整備の用に供される部分で、泡・不活性ガス・ハロゲン化物・粉末消火設備のいずれかの設置が必要となる床面積はどれか。",o:["200m²以上","300m²以上","400m²以上","500m²以上"],a:3,e:"1階は500m²以上、地階又は2階以上は200m²以上。駐車の用に供される部分と同じ面積。"},
{id:"sm42",g:"sm",q:"貯蔵容器や容器弁に設ける安全装置（破壊板など）の役割として、正しいものはどれか。",o:["消火剤の放射量を一定に保つ","起動用ガスを選択弁へ導く","容器弁の誤作動を電気的に防ぐ","容器内の圧力が異常に上昇したときに作動して圧力を逃がす"],a:3,e:"温度上昇などで容器内圧が異常に高くなったとき、破壊板が破れるなどして圧力を逃がし、容器の破裂を防ぐ。"},
{id:"sm43",g:"sm",q:"低圧式二酸化炭素消火設備で、貯蔵容器から消火剤を放出するために設ける弁はどれか。",o:["容器弁","放出弁","逆止弁","安全弁"],a:1,e:"高圧式は各容器の容器弁を開放するが、低圧式（大型の貯蔵タンク）は放出弁を開いて放出する。"},
{id:"sm44",g:"sm",q:"二酸化炭素の臨界温度に最も近いものはどれか。",o:["約−78℃","約0℃","約31℃","約100℃"],a:2,e:"臨界温度は約31℃で、これを超えるといくら加圧しても液化しない。−78.5℃はドライアイスの昇華温度。"},
{id:"sm45",g:"sm",q:"窒素について、誤っているものはどれか。",o:["空気の約78%を占める","不燃性である","空気より重く、低所にたまりやすい","無色・無臭である"],a:2,e:"窒素は空気よりわずかに軽い。低所に滞留しやすいのは空気の約1.5倍重い二酸化炭素。"},
{id:"sm46",g:"sm",q:"第4種粉末消火剤の着色として、正しいものはどれか。",o:["白色","紫色","淡紅色","ねずみ色"],a:3,e:"第1種白色、第2種紫色系、第3種淡紅色、第4種ねずみ色。"},
{id:"sm47",g:"sm",q:"食用油の火災に対してケン化作用による効果が特に大きい粉末消火剤はどれか。",o:["第1種粉末","第2種粉末","第3種粉末","第4種粉末"],a:0,e:"第1種（炭酸水素ナトリウム）は油と反応して石けん状の膜をつくり、再燃を防ぐ。"},
{id:"sm48",g:"sm",q:"ハロン1301について、正しいものはどれか。",o:["オゾン層を破壊しないため、現在も自由に製造されている","オゾン層破壊物質として生産が全廃され、既設設備の消火剤は回収・再利用で管理されている","常温・常圧で液体である","主な消火作用は窒息作用である"],a:1,e:"ハロンはオゾン層保護のため生産が全廃され、必要不可欠な用途に限って回収・再利用されている。常温で気体、主な消火作用は負触媒作用。"},
{id:"sm49",g:"sm",q:"窒素やIG-541による消火の主な作用として、正しいものはどれか。",o:["冷却作用","負触媒作用","酸素濃度を下げる窒息作用","乳化作用"],a:2,e:"不活性ガスを放射して区画内の酸素濃度を下げる窒息作用で消火する。"},
{id:"sm50",g:"sm",q:"第2種粉末消火剤の主成分として、正しいものはどれか。",o:["炭酸水素ナトリウム","炭酸水素カリウム","りん酸アンモニウム","尿素"],a:1,e:"第2種は炭酸水素カリウム。第4種は炭酸水素カリウムと尿素の反応物。"},
{id:"se18",g:"se",q:"非常電源から制御盤までの配線として、正しいものはどれか。",o:["耐火配線とする","耐熱配線とする","一般配線でよい","ビニルコードでよい"],a:0,e:"非常電源から制御盤までは、火災時にも電源を確保できるよう耐火配線とする。"},
{id:"se19",g:"se",q:"不活性ガス消火設備の制御盤の機能として、誤っているものはどれか。",o:["起動信号を受けて音響警報装置を鳴動させる","遅延時間の経過後に起動用ガス容器を開放させる","放出後に消火剤を自動で補充する","自動・手動の切替状態を表示する"],a:2,e:"放出後の消火剤の再充てんは整備作業として行うもので、制御盤が自動補充することはない。"},
{id:"sm51",g:"sm",q:"全域放出方式の二酸化炭素消火設備が自動起動するときの動作の順序として、正しいものはどれか。",o:["感知器作動 → 起動用ガス容器開放 → 遅延 → 音響警報 → 放射","感知器作動 → 音響警報 → 遅延 → 起動用ガス容器開放 → 選択弁・容器弁開放 → 放射","感知器作動 → 選択弁開放 → 音響警報 → 放射 → 遅延","音響警報 → 放射 → 感知器作動 → 選択弁開放"],a:1,e:"警報で避難を促し、遅延時間の後に起動用ガスで選択弁・容器弁を開いて放射する。放射の圧力で圧力スイッチが働き、放出表示灯が点灯する。"},
{id:"sm52",g:"sm",q:"高圧ガス容器の刻印「TP」が表すものはどれか。",o:["内容積","容器の質量","耐圧試験圧力","最高充てん圧力"],a:2,e:"V＝内容積、W＝容器質量、TP＝耐圧試験圧力、FP＝最高充てん圧力。"},
{id:"sm53",g:"sm",q:"加圧式粉末消火設備の加圧用ガス容器の役割として、正しいものはどれか。",o:["粉末消火剤を加圧して放射させるためのガスを供給する","選択弁を開放するためのガスだけを供給する","起動用ガス容器を冷却する","容器弁の破壊板を保護する"],a:0,e:"加圧用ガスで貯蔵容器内の粉末を加圧・流動化させて放射する。弁を開くためのガスは起動用ガス容器から供給する。"},
{id:"sm54",g:"sm",q:"移動式の不活性ガス消火設備で、貯蔵容器の直近の見やすい箇所に設けるものはどれか。",o:["緑色の灯火","青色の灯火","黄色の灯火","赤色の灯火と、移動式の設備である旨の表示"],a:3,e:"移動式は、貯蔵容器の直近の見やすい箇所に赤色の灯火と移動式の設備である旨の表示を設ける。"},
{id:"sm55",g:"sm",q:"粉末消火剤の点検で、異常と判断すべきものはどれか。",o:["さらさらと流動する","所定の色をしている","固化して塊になっている","異物が混入していない"],a:2,e:"粉末は吸湿すると固化し、放射できなくなる。固化・変色・異物の混入は異常。"},
{id:"se20",g:"se",q:"電路が充電されているかどうかを確認するために用いる器具はどれか。",o:["回路計","検電器","接地抵抗計","騒音計"],a:1,e:"検電器は電路に電圧がかかっているかどうかを音や光で知らせる。作業前の停電確認などに使う。"},
{id:"sm56",g:"sm",q:"移動式のハロゲン化物消火設備で、ホース接続口から防護対象物の各部分までの水平距離として、正しいものはどれか。",o:["10m以下","15m以下","20m以下","25m以下"],a:2,e:"ハロゲン化物は20m以下。二酸化炭素と粉末は15m以下。"},
{id:"sm57",g:"sm",q:"窒素・IG-55・IG-541を放射する全域放出方式の噴射ヘッドの放射圧力として、正しいものはどれか。",o:["0.3MPa以上","0.9MPa以上","1.4MPa以上","1.9MPa以上"],a:3,e:"窒素・IG-55・IG-541は1.9MPa以上。二酸化炭素は高圧式1.4MPa・低圧式0.9MPa、ハロン1301・HFC-23は0.9MPa、HFC-227ea・FK-5-1-12は0.3MPa、粉末は0.1MPa。"},
{id:"sm58",g:"sm",q:"HFC-227eaを放射する全域放出方式の噴射ヘッドの放射圧力として、正しいものはどれか。",o:["0.3MPa以上","0.9MPa以上","1.4MPa以上","1.9MPa以上"],a:0,e:"HFC-227eaとFK-5-1-12は0.3MPa以上。HFC-23はハロン1301と同じ0.9MPa以上。"},
{id:"sm59",g:"sm",q:"加圧式粉末消火設備の放出弁について、誤っているものはどれか。",o:["通常時は閉じている","定圧作動装置の働きによって開放される","手動でも開放できるものとする","摩擦損失を大きくするため仕切弁や玉形弁を用いる"],a:3,e:"放出弁は摩擦損失の少ないボールバルブなどを用い、仕切弁や玉形弁は使わない。"},
{id:"sm60",g:"sm",q:"粉末消火設備の噴射ヘッドに封板を設ける目的として、ごみの侵入防止のほかに正しいものはどれか。",o:["放射圧力を高めるため","配管内に水分が入らないようにするため","消火剤の色を確認するため","放射方向を調整するため"],a:1,e:"粉末は湿気で固化するので、封板で配管内への水分の侵入を防ぐ。"},
{id:"sm61",g:"sm",q:"高圧式二酸化炭素貯蔵容器の消火剤量の点検で、測定結果と設計図書の値との差の判定基準として、正しいものはどれか。",o:["5%以内","10%以内","15%以内","20%以内"],a:1,e:"差が10%以内であること。15%の差があれば「否」。"},
{id:"sm62",g:"sm",q:"移動式の第3種粉末消火設備で、1のノズルにつき貯蔵する消火剤の量として、正しいものはどれか。",o:["20kg以上","30kg以上","50kg以上","90kg以上"],a:1,e:"第1種50kg、第2種・第3種30kg、第4種20kg。90kgは移動式の二酸化炭素。"},
{id:"sm63",g:"sm",q:"二酸化炭素を貯蔵する容器の容器弁に設ける安全装置の作動圧力の範囲として、正しいものはどれか。",o:["5.0MPa以上10MPa以下","10MPa以上15MPa以下","17.15MPa以上24.5MPa以下","24.5MPa以上30MPa以下"],a:2,e:"二酸化炭素用（HFC-23用も同じ）は17.15MPa以上24.5MPa以下で作動する。"},
{id:"sm64",g:"sm",q:"中央のナットを回すと分解でき、配管を回さずに接続や取り外しができる管継手はどれか。",o:["ソケット","ニップル","ユニオン","ブッシング"],a:2,e:"ユニオンは機器の交換などで配管を回さずに取り外したい箇所に使う。ブッシングは口径を小さくする継手。"},
{id:"sm65",g:"sm",q:"粉末消火設備のクリーニングについて、正しいものはどれか。",o:["クリーニング用のガスは貯蔵タンクを経由させずに直接配管に送り込む","クリーニングは消火剤を再充てんしてから行う","クリーニング中は選択弁を閉じておく","クリーニングには水を用いる"],a:0,e:"放射後すぐにクリーニング弁を操作し、加圧用ガス（又はクリーニング用ガス）を貯蔵タンクを通さずに配管へ送って残った粉末を除去する。作動した選択弁はクリーニングが終わるまで開いておく。"},
{id:"sm66",g:"sm",q:"全域放出方式の二酸化炭素消火設備の総合点検で放射する試験用ガスとして、正しいものはどれか。",o:["二酸化炭素を消火剤必要量の全量","窒素ガス又は空気を、消火剤必要量の10%相当分","ハロン1301を少量","水を配管容量分"],a:1,e:"試験用ガスは窒素ガス又は空気で、放射区画の消火剤必要量の10%相当分とする。"},
{id:"se21",g:"se",q:"不活性ガス消火設備で、一般配線としてよいものはどれか（必要最低限の種類とする）。",o:["非常電源から制御盤まで","制御盤から音響警報装置まで","制御盤から感知器まで","制御盤から起動用ガス容器のソレノイドまで"],a:2,e:"感知器への配線は一般配線でよい。非常電源〜制御盤は耐火配線、警報装置・表示灯・ソレノイド・電気式閉鎖装置・起動装置へは耐熱配線。"},
{id:"se22",g:"se",q:"耐熱配線の工事方法として、認められないものはどれか。",o:["金属管工事","可とう電線管工事","金属ダクト工事","合成樹脂管工事"],a:3,e:"耐熱配線では合成樹脂管工事は不可。耐火配線は電線を管に収めて耐火構造の壁などに埋設する（MIケーブル・耐火電線は埋設不要）。"},
{id:"se23",g:"se",q:"電気を使用する手動起動装置（操作箱）に設けなければならないものはどれか。",o:["電源表示灯","放出表示灯","圧力計","非常電源の切替スイッチ"],a:0,e:"電気を使う起動装置には電源表示灯を設ける。放出用スイッチは有機ガラスなどで防護する。"},
{id:"sm67",g:"sm",q:"全域放出方式の不活性ガス消火設備の総合点検について、誤っているものはどれか。",o:["非常電源に切り替えた状態で確認する","放射区域が2以上あるときは、点検のたびに放射区域を順に変えて確認する","試験用ガスには窒素ガス又は空気を用いる","試験用ガスの容器は、本数の制限なく設置消火剤貯蔵容器と同じ本数を使う"],a:3,e:"試験用ガスは設置されている貯蔵容器と同じ容量の容器を使い、5本を超えないこととされている。"},
{id:"sm68",g:"sm",q:"消防用設備等の「総合点検」の説明として、正しいものはどれか。",o:["外観や簡易な操作で機器の損傷や機能を確認する","設備の全部又は一部を作動させたり使用したりして、総合的な機能を確認する","消火剤の量だけを確認する","工事の完了時に消防職員が行う検査"],a:1,e:"機器点検は外観や簡易な操作による確認、総合点検は設備を作動・使用して総合的な機能を確認する点検。"},
{id:"sm69",g:"sm",q:"粉末消火設備の圧力調整器の内部で、加圧用ガス容器から入る高い圧力がかかる部屋と、減圧されたガスが出ていく部屋の名称の組合せとして、正しいものはどれか。",o:["一次側：低圧室／二次側：高圧室","一次側：高圧室／二次側：低圧室","一次側：調整室／二次側：充てん室","一次側：中圧室／二次側：調整室"],a:1,e:"一次側（容器側）が高圧室、二次側（貯蔵タンク側）が低圧室。上部の調整ねじでばねの強さを変え、ダイヤフラムが圧力を受けて弁を動かす。"},
{id:"ks14",g:"ks",q:"不活性ガス消火設備の選択弁の開放方式について、正しいものはどれか。",o:["常時開で、火災時に電気信号で閉じる","常時閉で、電気式・ガス圧式等の開放装置で開放でき、手動でも容易に開放できる","常時閉で、手動でのみ開放できる","常時閉で、消火剤の放出圧力でのみ開放できる"],a:1,e:"選択弁は常時閉止状態で、電気式・ガス圧式などの開放装置で開放でき、かつ手動でも容易に開放できるもの（開放装置を手動で操作するものを含む）とする。"},

const pick=a=>a[Math.floor(Math.random()*a.length)];
const nf=x=>String(+(+x).toPrecision(4));
function mk(q,ans,dis,unit,e){
  const set=[ans];
  for(const d of dis){if(d>0&&isFinite(d)&&set.every(v=>nf(v)!==nf(d)))set.push(d);if(set.length===4)break}
  let m=2;while(set.length<4){const d=ans*m;if(set.every(v=>nf(v)!==nf(d)))set.push(d);m++}
  const o=shuffle(set);return{q,o:o.map(v=>nf(v)+unit),a:o.indexOf(ans),e};
}

 ["基礎 機械・容積一定の気体",()=>{const P1=pick([0.3,0.6,0.9,1.2,1.5]);const [t1,t2]=pick([[27,127],[27,87],[27,177],[27,327],[27,-73],[7,147]]);const T1=t1+273,T2=t2+273;const ans=P1*T2/T1;
  return mk(`容積一定の容器に、絶対圧力${P1}MPa・温度${t1}℃の気体が入っている。温度を${t2}℃にしたときの絶対圧力はいくらか。`,ans,[P1*T1/T2,P1*t2/t1,P1+(t2-t1)/1000],"MPa",`P/T一定。絶対温度で計算する：${P1}×(${T2}÷${T1})＝${nf(ans)}MPa。℃のまま計算しないこと。`)}],

 ["基礎 機械・仕事と動力",()=>{const F=pick([20,40,50,100]);const d=pick([2,3,5]);const t=pick([4,5,10]);const W=F*d;const ans=W/t;

 ["基礎 電気・消費電力",()=>{const I=pick([2,3,4,5]);const R=pick([5,10,20]);const ans=I*I*R;

let drill=null;
function renderDrill(list){
  if(!drill)drill=Array.from({length:6},()=>{const g=pick(GEN);return{t:g[0],...g[1](),p:undefined}});
  list.insertAdjacentHTML("beforeend",`<div class="sec">計算ドリル</div><p class="subsec">基礎的知識の計算問題を、数値を変えて何度でも出題します（${GEN.length}パターン、得点には含みません）。</p>`);
  drill.forEach((x,i)=>list.appendChild(mcCard(x,i+1,x.t,x.p,true,v=>{x.p=v;renderPractice()})));
  const row=document.createElement("div");row.className="row";
  const b=document.createElement("button");b.className="btn pri";b.type="button";b.textContent="別の数値で6問出題";
  b.onclick=()=>{drill=null;renderPractice();window.scrollTo({top:0})};
  row.appendChild(b);list.appendChild(row);
}

{id:"k20",ph:"絶縁抵抗計 メガー",q:"点検に使う計器で、電路と大地の間などに直流の高い電圧を加え、MΩ単位で値を読み取るものがある。①名称、②対地電圧150V以下の低圧電路での判定基準を答えよ。",k:"①絶縁抵抗計（メガー）\n②0.1MΩ以上"},
{id:"k21",ph:"接地抵抗計 補助接地棒",q:"本体のほかに、地面に打ち込む補助接地棒2本と測定用のコードが付属している計器がある。①名称、②D種接地工事の判定基準（地絡時に自動遮断する装置がない場合）を答えよ。",k:"①接地抵抗計（アーステスター）\n②100Ω以下"},
{id:"k22",ph:"回路計 テスター",q:"切替つまみで交流電圧・直流電圧・抵抗などのレンジを選んで測定する、携帯形の計器がある。①名称、②消火設備の点検での使い方を2つ答えよ。",k:"①回路計（テスター）\n②電源電圧の測定／配線の導通（断線の有無）の確認／予備電源の電圧の確認、などから2つ"},
{id:"k23",ph:"検電器 低圧",q:"先端を電線や端子に当てると、電圧がかかっていれば音や光で知らせる器具がある。名称と用途を答えよ。",k:"名称：検電器\n用途：電路が充電されている（電圧がかかっている）かどうかを確認する。作業前の停電確認などに使う。"},
{id:"k24",ph:"粉末消火剤 点検",q:"粉末消火設備の点検で、消火剤を一部採取したときに確認する事項を3つ答えよ。",k:"固化（塊）がないこと／変色や異物の混入がないこと／吸湿しておらず、さらさらと流動すること／所定の種別（色）であること、などから3つ"},
{id:"k25",ph:"移動式粉末消火設備 ホースリール",q:"ホースリール・ノズル・ノズル開閉弁を収納した格納箱があり、貯蔵容器の近くに赤色の灯火と表示が設けられている。①この設備の名称、②防護対象物の各部分からホース接続口までの水平距離の基準を答えよ。",k:"①移動式の消火設備\n②二酸化炭素・粉末は15m以下、ハロゲン化物は20m以下\n※貯蔵容器の直近の見やすい箇所に、赤色の灯火と移動式の設備である旨の表示を設ける。"},
{id:"k26",q:"粉末消火剤の第1種〜第4種について、それぞれの主成分と着色を答えよ。",k:"第1種：炭酸水素ナトリウム／白色\n第2種：炭酸水素カリウム／紫色系\n第3種：りん酸塩類（りん酸アンモニウム）／淡紅色\n第4種：炭酸水素カリウムと尿素の反応物／ねずみ色"},
{id:"k27",q:"ハロン1211の化学式を答え、ハロン番号の4つの数字が何を表しているか説明せよ。",k:"化学式：CF₂ClBr\n数字は左から、炭素（C）・ふっ素（F）・塩素（Cl）・臭素（Br）の原子の数を表す。"},
{id:"k28",q:"内容積68Lの貯蔵容器に、二酸化炭素45kgが充てんされている。①充てん比を求めよ（小数第2位まで）。②高圧式の基準に適合しているか答えよ。",k:"①68÷45≒1.51\n②適合している（高圧式の基準は1.5以上1.9以下）"},
{id:"k29",q:"内容積1Lの起動用ガス容器に、二酸化炭素0.6kgが充てんされている。充てん比を求め、起動用ガス容器の基準に適合しているか答えよ。",k:"充てん比＝1÷0.6≒1.67\n基準（内容積1L以上、二酸化炭素0.6kg以上、充てん比1.5以上）に適合している。"},
{id:"k30",ph:"二酸化炭素消火設備 閉止弁",q:"全域放出方式の二酸化炭素消火設備の点検が終わったあとに行う復旧作業を3つ答えよ。",k:"閉止弁を「開」に戻す／取り外した電磁開放器や操作管を元に戻し、安全ピンを抜く／自動手動切替装置を元の状態に戻す／制御盤の表示に異常がないことを確認する／関係者に点検終了を伝える、などから3つ"},
{id:"k31",q:"全域放出方式の二酸化炭素消火設備で、遅延装置の作動を点検する方法と判定基準を答えよ。",k:"方法：誤放出防止の措置をしたうえで手動起動装置を操作し、放出用スイッチの操作から起動信号が出る（電磁開放器が作動する）までの時間をストップウォッチで測定する。\n判定基準：20秒以上であること。"},
{id:"k32",q:"加圧式粉末消火設備に設けられる「起動用ガス容器」と「加圧用ガス容器」の役割の違いを説明せよ。",k:"起動用ガス容器：選択弁や放出弁などを開放させるためのガスを供給する。\n加圧用ガス容器：粉末消火剤の貯蔵容器に送り込み、消火剤を加圧して放射させるためのガスを供給する。"},
{id:"k33",ph:"高圧ガス容器 刻印",q:"高圧ガス容器の肩部に打たれている刻印のうち、①V、②W、③TP、④FP が表すものを答えよ。",k:"①V：内容積（L）\n②W：容器の質量（kg、附属品を含まない）\n③TP：耐圧試験圧力（MPa）\n④FP：最高充てん圧力（MPa）"},
{id:"k34",ph:"不活性ガス消火設備 噴射ヘッド",q:"噴射ヘッドの外観点検で確認する事項を3つ答えよ。",k:"変形・損傷・腐食がないこと／ノズル（オリフィス）が目詰まりしていないこと／取付けが緩んでいないこと／放射の障害となる物が周囲にないこと、などから3つ"},
{id:"k35",q:"次の説明に当てはまる放出方式の名称を答えよ。<br>①防火上有効に区画された部分を消火剤で満たして消火する。<br>②可燃物に直接消火剤を放射して消火する。<br>③人がホースを延長して消火する。",k:"①全域放出方式\n②局所放出方式\n③移動式"},
{id:"k36",ph:"二酸化炭素消火設備 注意銘板",q:"全域放出方式の二酸化炭素消火設備で、防護区画の出入口付近に設ける保安上の表示を2つ挙げ、それぞれの目的を答えよ。",k:"放出表示灯：消火剤が放出されたことを表示し、区画への入室を防ぐ。\n注意銘板：区画内に消火設備が設置されていることや、放出時は区画外へ退避することなどを表示して注意を促す。"},
{id:"k37",ph:"容器弁 破壊板 安全装置",q:"貯蔵容器の容器弁に取り付けられている、一定以上の圧力になると破れて容器内の圧力を逃がす部品の名称と目的を答えよ。",k:"名称：破壊板（安全装置）\n目的：周囲温度の上昇などで容器内の圧力が異常に高くなったとき、圧力を逃がして容器の破裂を防ぐ。"},
{id:"k38",ph:"IG-541 消火設備",q:"防護区画の注意銘板に「IG-541」と表示されている。①この消火剤の分類、②組成、③主な消火作用を答えよ。",k:"①不活性ガス消火剤\n②窒素52%・アルゴン40%・二酸化炭素8%\n③酸素濃度を下げる窒息作用"},
{id:"k39",ph:"管継手 種類 ソケット エルボ ティー",q:"次の説明に当てはまる管継手の名称を答えよ。<br>①両端がめねじになっている短い筒で、同じ径の管どうしをまっすぐつなぐ<br>②めねじで管の端にかぶせてふさぐ<br>③おねじで管の端や継手の口に差し込んでふさぐ<br>④両端がおねじになっている短い管で、継手どうしをつなぐ<br>⑤配管の向きを90°曲げる<br>⑥配管を3方向に分岐させる",k:"①ソケット\n②キャップ\n③プラグ\n④ニップル\n⑤エルボ\n⑥ティー"},
{id:"k40",ph:"ブッシング ユニオン 管継手",q:"次の説明に当てはまる管継手の名称を答えよ。<br>①外側がおねじ・内側がめねじで、継手の口径を小さくする<br>②中央のナットを回すと分解でき、配管を回さずに接続・取り外しができる<br>③配管を4方向に分岐させる<br>④管の端に取り付け、ボルトで締めて機器や管と接続する円盤状の継手",k:"①ブッシング\n②ユニオン\n③クロス\n④フランジ"},
{id:"k41",ph:"パイプねじ切り器 手動",q:"円形の本体の中央に刃（チェーザ）が組み込まれ、両側に長いハンドルが付いた手動工具がある。名称と用途を答えよ。",k:"名称：ねじ切り器（パイプねじ切り器）\n用途：配管の端に管用ねじのおねじを切る。"},
{id:"k42",ph:"パイプカッター フレアツール パイプバイス",q:"次の説明に当てはまる工具の名称を答えよ。<br>①管をはさんだ円盤状の刃を、回しながら締め込んで管を切断する<br>②銅管の端を円すい状（ラッパ状）に広げる<br>③作業台に取り付け、管をはさんで固定する<br>④鎖を管に巻き付けて、太い管を回したり締め付けたりする",k:"①パイプカッター\n②フレアツール\n③パイプバイス\n④チェーントング（鎖パイプレンチ）"},
{id:"k43",ph:"フレア継手 銅管 フレアナット",q:"不活性ガス消火設備の操作管（銅管）を継手に接続するため、銅管の端を円すい状に広げ、ナットで継手本体に締め付ける方式がある。①管端を広げる加工の名称と、加工するときの注意点、②締め付けるナットの名称を答えよ。",k:"①フレア加工。切断面のバリをきれいに取り除く。専用工具で正確に加工し、広げすぎ・偏肉・割れ・きずがないようにする。\n②フレアナット（継手と銅管を接合する）\n※もう一つの接続方式の食い込み継手では、スリーブの向きを間違えないよう注意する。"},
{id:"k44",ph:"操作管 逆止弁 消火設備",q:"起動用ガス容器と貯蔵容器をつなぐ細い配管の途中に、ガスの流れる向きを示す矢印が刻まれた小さな弁が取り付けられている。①名称、②取り付ける配管の名称、③取り付ける目的を答えよ。",k:"①逆止弁\n②操作管\n③複数の防護区画で貯蔵容器を共用するとき、起動用ガスを一方向にだけ流し、区画ごとに必要な本数の貯蔵容器だけを開放させるため。"},
{id:"k45",ph:"操作管 逃がし弁 リリーフ弁",q:"二酸化炭素消火設備の操作管に取り付けられ、操作管内の圧力がわずかに上がったときにガスを逃がす弁がある。①名称、②取り付ける配管、③目的を答えよ。",k:"①逃がし弁（リリーフ弁）\n②操作管（起動用ガス容器と貯蔵容器の間）\n③起動用ガス容器からのガスの漏れで操作管内の圧力が上がり、貯蔵容器の容器弁が誤って開放されるのを防ぐため。"},
{id:"k46",ph:"容器弁開放装置 手動 安全クリップ",q:"全域放出方式の二酸化炭素消火設備で、手動起動装置の放出スイッチを押しても、起動用ガス容器の電気式の容器弁開放装置が作動せず、消火剤が放射されなかった。この場合に消火剤を放射させる方法を2つ答えよ。",k:"①貯蔵容器に取り付けられた容器弁開放装置を手動で操作して開放する（安全クリップを外してノブを押すなど）。\n②起動用ガス容器に取り付けられた容器弁開放装置を手動で操作して開放する（キャップを外してノブを操作するなど）。"},
{id:"k47",ph:"二酸化炭素 容器弁 構造",q:"二酸化炭素の貯蔵容器の容器弁と容器弁開放装置について、次の部分の名称を答えよ。<br>①消火剤を充てんするとき、その圧力で動いて容器内への通路を開く部品<br>②容器内の圧力が一定以上になると作動してガスを逃がす部分<br>③手動開放ノブが誤って押されないように差し込まれている金具<br>④手で押して容器弁を開放するための部分",k:"①遊動子\n②安全装置（安全弁）\n③安全クリップ（安全金具）\n④手動開放ノブ\n※消火剤は放出口の側から充てんし、サイフォン管を通って容器内に入る。"},
{id:"k48",ph:"不活性ガス消火設備 選択弁 操作管",q:"貯蔵容器室で、集合管から分岐した太い配管に取り付けられ、細い銅管が接続された弁が防護区画の数だけ並んでいる。①名称と目的、②自動式の場合にこの弁を開放させるものを答えよ。",k:"①選択弁。防護区画（防護対象物）が2以上あって貯蔵容器を共用する場合に、選ばれた区画にだけ消火剤を送るための弁。\n②起動用ガス容器から操作管（銅管）を通って導かれる二酸化炭素のガス圧力。\n※選択弁は常時閉で、電気式・ガス圧式などの開放装置で開き、手動でも容易に開放できるものとする。"},
{id:"k49",ph:"ピストンレリーザー ダンパー",q:"二酸化炭素を放射する全域放出方式の防護区画で、換気口のダンパーの横に、噴射ヘッドへの配管から分岐した銅管がつながった筒形の装置がある。①名称、②何の力で作動するか、③閉じたダンパーを元に戻すときに操作するものを答えよ。",k:"①ピストンレリーザー（自動閉鎖装置）\n②消火剤の放出圧力\n③ダンパー復旧弁箱の中の弁を操作して、残った圧力を抜く。"},
{id:"k50",ph:"閉止弁 リミットスイッチ",q:"二酸化炭素消火設備の系統図で、集合管に設けた閉止弁に「LS」と書かれている。①LSの名称、②設ける目的を答えよ。",k:"①リミットスイッチ\n②閉止弁が開いているか閉じているかの信号を制御盤に送り、閉止弁の状態を監視するため。"},
{id:"k51",ph:"二酸化炭素消火設備 注意標識",q:"二酸化炭素消火設備の防護区画の出入口に、「消火ガスを吸い込むと死亡のおそれがある」「消火ガスが放出されたら入室しない」といった内容の標識を設ける。①標識の地色と文字の色、②このような標識を設ける場所を2つ答えよ。",k:"①地色は黄色、文字は黒色\n②防護区画の出入口、貯蔵容器を設ける場所\n※二酸化炭素以外の不活性ガスやハロゲン化物、粉末の設備でも、出入口に消火剤名を記した標識（黄色地に黒文字）を設ける。"},
{id:"k52",ph:"窒素消火設備 集合管 連結管",q:"窒素を放射する不活性ガス消火設備の貯蔵容器の上部に、太さの異なる3種類の配管がある。①最も太い配管、②各容器の容器弁と①をつなぐ中くらいの太さの配管、③最も細い銅管、の名称を答えよ。",k:"①集合管\n②連結管（銅管のほか、可とう管継手＝フレキシブル管を使うこともある）\n③操作管"},
{id:"k53",ph:"起動用ガス容器 容器弁開放装置",q:"二酸化炭素消火設備で、制御盤の近くに置かれた小さな容器から、細い配管が貯蔵容器の容器弁開放装置につながっている。①この小さな容器の名称、②その働きを答えよ。",k:"①起動用ガス容器\n②容器内のガス圧で、貯蔵容器に取り付けた容器弁開放装置を作動させて容器弁を開放する。防護区画が複数ある場合は選択弁の開放にも使われる。"},
{id:"k54",ph:"不活性ガス消火設備 耐火配線 耐熱配線",q:"二酸化炭素を放射する不活性ガス消火設備の配線について、次の配線に必要な種類（耐火配線・耐熱配線・一般配線）を答えよ。<br>①非常電源から制御盤まで<br>②制御盤から音響警報装置まで<br>③制御盤から放出表示灯まで<br>④制御盤から感知器まで<br>⑤制御盤から起動用ガス容器のソレノイドまで<br>⑥制御盤から電気式の自動閉鎖装置（ダンパー・シャッター）まで<br>⑦制御盤から手動起動装置まで",k:"①耐火配線\n②耐熱配線\n③耐熱配線\n④一般配線でよい\n⑤耐熱配線\n⑥耐熱配線\n⑦耐熱配線"},
{id:"k55",q:"耐火配線と耐熱配線の工事方法の違いを説明せよ。",k:"耐火配線：耐熱性のある電線を金属管や合成樹脂管などに収め、耐火構造の壁や床などに埋設する。MIケーブルや耐火電線を使う場合は埋設しなくてよい。\n耐熱配線：耐熱性のある電線を金属管・可とう電線管・金属ダクトなどに収めるか、ケーブル工事とする。合成樹脂管工事は不可。"},
{id:"k56",ph:"容器弁 安全装置",q:"二酸化炭素の貯蔵容器の容器弁で、本体の横に突き出した部分は、容器内の圧力が一定以上になると作動する。①この部分の名称と役割、②二酸化炭素用の場合の作動圧力の範囲を答えよ。",k:"①安全装置。容器内圧が一定以上になると作動して内部のガスを放出し、容器の破裂を防ぐ。\n②17.15MPa以上24.5MPa以下（HFC-23用も同じ）"},
{id:"k57",ph:"ハロゲン化物消火設備 操作箱",q:"ハロン1301を放射する全域放出方式のハロゲン化物消火設備の手動起動装置（操作箱）について、①設置する場所、②本体又はその付近に表示しなければならない事項、③電気を使う起動装置に設けるもの、④放出用スイッチに施す措置、を答えよ。",k:"①防護区画外で区画内を見通すことができ、出入口付近など操作した者が容易に退避できる場所（床面から0.8m以上1.5m以下、外面は赤色）\n②ハロゲン化物消火設備の起動装置である旨と消火剤の種類（ハロン1301）、防護区画の名称、取扱い方法、保安上の注意事項\n③電源表示灯\n④音響警報装置を起動する操作の後でなければ操作できないものとし、有機ガラスなどによる有効な防護措置を施す。"},
{id:"k58",ph:"粉末消火設備 噴射ヘッド 封板",q:"全域放出方式の粉末消火設備の噴射ヘッドの先端に、薄い板（封板）が取り付けられている。①ごみの侵入防止以外の封板の目的、②噴射ヘッドの放射圧力の基準を答えよ。",k:"①配管内に水分（湿気）が入らないようにするため（粉末は湿気で固化するため）\n②0.1MPa以上"},

{id:"k60",ph:"粉末消火設備 定圧作動装置",q:"内部にスプリングと遊動子があり、加圧用ガスの圧力が設定値に達すると遊動子が動いて、放出弁の開放装置に圧力を送る装置がある。①名称、②使われる消火設備を答えよ。",k:"①定圧作動装置（スプリング式）\n②加圧式の粉末消火設備（移動式には設けなくてもよい）"},
{id:"k61",ph:"粉末消火設備 放出弁",q:"加圧式の粉末消火設備で、貯蔵タンクの下部の放出口に設けられている弁について、①名称、②通常時の状態（開・閉）、③起動時に開放されるまでの動作を答えよ。",k:"①放出弁\n②閉\n③加圧用ガスで粉末消火剤が十分にかき混ぜられ、貯蔵タンクの内圧が設計上必要な圧力に達すると、定圧作動装置が作動して放出弁が開放される。\n※放出弁は摩擦損失の少ないボールバルブなどを用い、ガス圧や電気などで迅速確実に開放でき、手動でも開放できるものとする。"},

{id:"k63",ph:"圧力調整器 断面 ダイヤフラム",q:"粉末消火設備の加圧用ガス容器に取り付ける圧力調整器について、①役割と調整後の圧力の上限、②内部にある、ばねの強さを変えて設定圧力を調整する部品と、圧力を受けて弁を動かす薄い膜の名称、③2つの圧力計（一次側・二次側）がそれぞれ示す圧力を答えよ。",k:"①加圧用ガス（窒素）の高い圧力を設計上必要な圧力まで減圧して貯蔵タンクへ送る。2.5MPa以下に調整する。\n②調整ねじ、ダイヤフラム（一次側が高圧室、二次側が低圧室）\n③一次側：加圧用ガス容器内の圧力（高圧）、二次側：減圧後に送り出す圧力"},
{id:"k64",ph:"移動式粉末消火設備",q:"移動式の粉末消火設備について答えよ。①格納箱の中にある主な構成部品を3つ、②ホース接続口から防護対象物の各部分までの水平距離、③第3種粉末の場合に1つのノズルにつき必要な消火剤の量。",k:"①加圧用ガス容器、貯蔵容器（貯蔵タンク）、放出弁、ホース、ノズル（ノズル開閉弁）など\n②15m以下\n③30kg以上（第1種50kg、第2種30kg、第4種20kg）"},
{id:"k65",ph:"加圧用ガス容器 窒素 圧力調整器 点検",q:"加圧式粉末消火設備の機器点検で、加圧用ガス容器（窒素、圧力調整器付き）のガス量を確認する方法と判定基準を答えよ。また、加圧用ガスが二酸化炭素の場合の確認方法も答えよ。",k:"窒素：圧力調整器の二次側の点検コックなどを閉じ、容器弁を手動又は開放装置で開いて、一次側の圧力計の指示を読む。判定は消火剤1kgにつき40L以上（35℃・0MPa換算）。\n二酸化炭素：連結管などを外して容器を取り出し、計量器で総質量を量り、容器と開放装置の質量を引く。判定は消火剤1kgにつき20g以上。"},
{id:"k66",q:"加圧式粉末消火設備の消火剤の貯蔵量が120kgで、加圧用ガス（窒素）の容器の内容積が47Lである。必要な窒素の量（L）と、それを1本の容器に充てんしたときの容器内の圧力（MPa、概算）を求めよ。1気圧＝0.101325MPaとする。",k:"必要な窒素量：120kg×40L＝4,800L\n容器内圧：4,800÷47≒102.1気圧 → 102.1×0.101325≒10.3MPa\nしたがって、圧力調整器の一次側の圧力計が約10.3MPa以上あればよい。"},
{id:"k67",q:"全域放出方式の二酸化炭素消火設備の総合点検で、試験用ガスを放射して確認する項目を4つ答えよ。また、試験用ガスの種類と量を答えよ。",k:"確認項目：警報装置が確実に鳴動すること／遅延装置が確実に作動すること／開口部の自動閉鎖装置が作動し換気装置が停止すること／起動装置と選択弁が確実に作動し試験用ガスが放射されること／配管から試験用ガスが漏れないこと／放出表示灯が確実に点灯すること、などから4つ\n試験用ガス：窒素ガス又は空気。放射区画の消火剤必要量の10%相当分（二酸化炭素1kgあたりの量で換算）。"},
{id:"k68",ph:"二酸化炭素 貯蔵容器",q:"高圧式の二酸化炭素貯蔵容器の機器点検で、はかりで消火剤量を量り設計図書と比べたところ、差が15%あった。①判定結果（合・否）とその理由、②はかり以外の測定方法、③窒素やIG-541の容器で通常用いる測定方法を答えよ。",k:"①否。消火剤量の測定結果と設計図書との差は10%以内でなければならない。\n②液面計（液化ガスレベルメーター）を用いる方法\n③容器内圧力による方法（気体で充てんされているため）。二酸化炭素は温度で圧力が大きく変わるので、圧力では量を判断できない。"},
{id:"k69",ph:"液化ガスレベルメーター",q:"放射線源とセンサーで容器をはさみ、上下に動かして容器内の液面の位置を探す点検用の機器がある。①名称と用途、②この機器を点検に使う消火設備を2つ答えよ。",k:"①液面計（液化ガスレベルメーター）。放射線を利用して容器内の消火剤の液面を測定し、換算表で液面の高さから消火剤量を求める。\n②二酸化炭素消火設備、ハロン1301消火設備"},
{id:"k70",ph:"移動式二酸化炭素消火設備",q:"移動式の不活性ガス消火設備の総合点検で、ノズル開閉弁とホース・ホース接続部について確認する判定基準を答えよ。",k:"指定の容器弁開放装置が作動し、ホースの引出しやノズル開閉弁などに異常がなく、試験用ガスが正常に放射されること。ホースとホース接続部から試験用ガスが漏れないこと。"},
{id:"k71",q:"二酸化炭素を放射する全域放出方式の不活性ガス消火設備を点検するときの一般的な留意事項を4つ答えよ。",k:"点検前に、とるべき措置と手順を定めた図書の内容を確認する／閉止弁は点検前に「閉」とし、すべて終わったら「開」に戻す／防護区画内に人が入る場合は自動手動切替装置を手動にしておく／誤放出防止のため機器に強い衝撃を与えない／機器を外した場合は、終了後に接続部の緩み・脱落や封印を再確認する／点検前に制御回路の電源を「断」にし、操作管（貯蔵容器側）を外してから電気式の容器弁開放装置を取り外す、などから4つ"},
{id:"k72",q:"全域放出方式のハロゲン化物消火設備の点検で、次の配線の種類が妥当かどうか判断し、妥当でなければ正しい種類を答えよ（必要最低限の種類で答える）。<br>①非常電源〜制御盤：耐火電線<br>②制御盤〜音響警報装置：耐熱電線<br>③制御盤〜電気式の自動閉鎖装置：一般電線<br>④制御盤〜感知装置：耐火電線",k:"①このままで妥当\n②このままで妥当\n③不適。耐熱電線とする。\n④このままでもよいが、必要最低限としては一般電線で足りる。"},
{id:"k73",ph:"選択弁 ガス圧式 電気式",q:"不活性ガス消火設備の選択弁について答えよ。①開放装置の方式による種類を2つ、②通常時の状態（開・閉）、③開放装置が働かないときの開け方、④ガス圧式の場合に弁を開く力の出どころ、を答えよ。",k:"①ガス圧式（ガス圧開放式）、電気式（電気開放式）\n②常時閉\n③手動で容易に開放できる構造になっている（開放装置を手動で操作するものを含む）\n④起動用ガス容器から操作管（銅管）を通って導かれる起動用ガスの圧力"},
{id:"k74",ph:"選択弁 ガス圧式 操作管",q:"貯蔵容器室の選択弁を見ると、弁の開放装置に細い銅管がつながっているものと、電線がつながっているものがある。それぞれの選択弁の種類と、開放するときに何で作動するかを答えよ。",k:"銅管がつながっている：ガス圧式。起動用ガス容器から操作管を通って送られるガスの圧力で開放装置が作動して開く。\n電線がつながっている：電気式。制御盤からの電気信号で開放装置（電磁弁や電動機など）が作動して開く。\n※どちらも手動で容易に開放できなければならない。"}

// ── storage ──
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const byId=Object.fromEntries(P.map(x=>[x.id,x])); const kById=Object.fromEntries(K.map(x=>[x.id,x]));
let mode=load("o3-mode","exam"); let pAns=load("o3-pans",{}); let pKan=load("o3-pkan",{}); let pFilter="all";
let ex=load("o3-exam",null); if(ex&&(!ex.ids||ex.ids.some(id=>!byId[id])))ex=null;
const LIMIT=105*60*1000; let tick=null;
const app=document.getElementById("app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const phLink=x=>x.ph?`<a class="btn ph" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(x.ph)}" target="_blank" rel="noopener">実物の写真を見る ↗</a>`:"";
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function renderModes(){
  const m=document.getElementById("modes");m.innerHTML="";
  [["exam","模擬試験（本番形式）"],["practice","分野別練習"]].forEach(([k,t])=>{
    const b=document.createElement("button");b.type="button";b.textContent=t;b.setAttribute("aria-pressed",mode===k);
    b.onclick=()=>{mode=k;store("o3-mode",k);renderModes();render()};m.appendChild(b);

}

  let h=`<div class="board"><div class="scores" id="pscores"></div><div class="judge"><span>選ぶとすぐ正誤と解説が出ます</span><button class="btn" id="preset" type="button">解答をリセット</button></div><div class="tabs" id="ptabs"></div></div><main id="plist"></main>`;
  app.innerHTML=h;
  const tabs=document.getElementById("ptabs");
  [["all","すべて"],["law","法令"],["basic","基礎"],["struct","構造・機能・規格"],["kan","鑑別"],["calc","計算ドリル"]].forEach(([k,t])=>{
    const b=document.createElement("button");b.type="button";b.textContent=t;b.setAttribute("aria-pressed",k===pFilter);
    b.onclick=()=>{pFilter=k;renderPractice();window.scrollTo({top:0})};tabs.appendChild(b);
  });
  let r=0;
  document.getElementById("preset").onclick=e=>{if(!r){r=1;e.target.textContent="もう一度押すとリセット";return}pAns={};pKan={};store("o3-pans",pAns);store("o3-pkan",pKan);renderPractice()};
  const list=document.getElementById("plist");
  if(pFilter==="calc"){renderDrill(list)}else{
  ORDER.forEach(g=>{
    if(pFilter!=="all"&&G[g].s!==pFilter)return;
    const items=P.filter(x=>x.g===g);
    list.insertAdjacentHTML("beforeend",`<div class="sec">${G[g].label}</div><p class="subsec">${items.length}問（本試験では${G[g].n}問）</p>`);
    items.forEach((x,i)=>list.appendChild(mcCard(x,`${i+1}`,G[g].label,pAns[x.id],true,v=>{pAns[x.id]=v;store("o3-pans",pAns);renderPractice()})));
  });
  if(pFilter==="all"||pFilter==="kan"){
    list.insertAdjacentHTML("beforeend",`<div class="sec">実技（鑑別）</div><p class="subsec">${K.length}問（本試験では5問・記述式）</p>`);
    K.forEach((x,i)=>{
      const d=document.createElement("article");d.className="q";
      d.innerHTML=`<div class="qh"><span class="no">鑑別${i+1}</span></div>${x.fig?FIG[x.fig]:""}<p class="qt">${x.q}</p>`;
      const b=document.createElement("button");b.className="btn warn";b.type="button";b.textContent=pKan[x.id]?"解答例を隠す":"解答例を見る";
      b.onclick=()=>{if(pKan[x.id])delete pKan[x.id];else pKan[x.id]=1;store("o3-pkan",pKan);renderPractice()};
      d.appendChild(b);
      if(pKan[x.id])d.insertAdjacentHTML("beforeend",`<div class="ex"><span class="r">解答例</span><div class="mine">${esc(x.k)}</div><div class="row">${phLink(x)}</div></div>`);
      list.appendChild(d);
    });
  }
  }
  const sc=document.getElementById("pscores");let to=0,ta=0;
  Object.entries(SUBJ).forEach(([s,v])=>{
    const its=P.filter(x=>G[x.g].s===s);const an=its.filter(x=>pAns[x.id]!==undefined);const ok=an.filter(x=>pAns[x.id]===x.a).length;to+=ok;ta+=an.length;
    sc.insertAdjacentHTML("beforeend",`<div class="sc"><b>${v.label}</b><span>${ok} / ${an.length}</span></div>`);
  });
  sc.insertAdjacentHTML("beforeend",`<div class="sc"><b>正答 / 解答済</b><span>${to} / ${ta}</span></div>`);
}

function mcCard(x,no,cat,picked,feedback,onPick){
  const d=document.createElement("article");d.className="q";
  d.innerHTML=`<div class="qh"><span class="no">問${no}</span>${cat?`<span class="cat">${cat}</span>`:""}</div><p class="qt">${x.q}</p>`;
  const ch=document.createElement("div");ch.className="ch";
  const reveal=feedback&&picked!==undefined;
  x.o.forEach((t,j)=>{
    const b=document.createElement("button");b.type="button";
    b.innerHTML=`<span class="n">(${j+1})</span><span>${t}</span>`;
    if(reveal){b.disabled=true;if(j===x.a)b.classList.add("right");else if(j===picked)b.classList.add("wrong")}
    else b.setAttribute("aria-pressed",picked===j);
    if(onPick)b.onclick=()=>onPick(j,b,ch);
    ch.appendChild(b);
  });
  d.appendChild(ch);
  if(reveal){const ok=picked===x.a;d.insertAdjacentHTML("beforeend",`<div class="ex"><span class="r ${ok?"ok-t":"ng-t"}">${ok?"正解":picked===null?"未解答":"不正解"}　正答 (${x.a+1})</span><br>${x.e}</div>`)}
  return d;
}

// ── exam ──
function newExam(){
  const ids=[];ORDER.forEach(g=>shuffle(P.filter(x=>x.g===g)).slice(0,G[g].n).forEach(x=>ids.push(x.id)));
  ex={ids,kids:shuffle(K).slice(0,5).map(x=>x.id),ans:{},txt:{},self:{},start:Date.now(),done:false,onlyWrong:false};store("o3-exam",ex);
}
function examScores(){
  const out={};let tot=0;
  Object.keys(SUBJ).forEach(s=>{const ids=ex.ids.filter(id=>G[byId[id].g].s===s);const ok=ids.filter(id=>ex.ans[id]===byId[id].a).length;out[s]={ok,n:ids.length};tot+=ok});
  const allPass=Object.values(out).every(v=>v.ok/v.n>=0.4);
  return{out,tot,pass:allPass&&tot/30>=0.6};
}
function fmt(ms){ms=Math.max(0,ms);const t=Math.ceil(ms/1000);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}

<p>筆記は四肢択一、試験時間は1時間45分。解答中は正誤が表示されず、最後にまとめて採点します。<br>合格基準：筆記は科目ごとに40%以上かつ全体で60%以上、実技は60%以上。</p>
<p class="subsec">開始するたびに問題プールからランダムに出題されます。</p>
<div class="row"><button class="btn pri" id="start" type="button">試験を開始する</button></div></section>`;
    document.getElementById("start").onclick=()=>{newExam();renderExam();window.scrollTo({top:0})};
    return;
  }
  if(ex.done)return renderResult();
  app.innerHTML=`<div class="board"><div class="scores">
<div class="sc warn"><b>残り時間</b><span class="timer" id="tm">--</span></div>
<div class="sc"><b>筆記 解答済</b><span id="cnt">0 / 30</span></div>
<div class="sc"><b>鑑別 記入済</b><span id="kcnt">0 / 5</span></div>
<div class="sc"><b>終了</b><span><button class="btn pri" id="fin" type="button">採点する</button></span></div></div></div><main id="elist"></main>
<div class="row"><button class="btn pri" id="fin2" type="button">解答を終了して採点する</button><button class="btn" id="quit" type="button">この試験を破棄</button></div>`;
  const list=document.getElementById("elist");let last="";
  ex.ids.forEach((id,i)=>{
    const x=byId[id];const s=G[x.g].s;
    if(s!==last){list.insertAdjacentHTML("beforeend",`<div class="sec">${SUBJ[s].label}</div>`);last=s}
    list.appendChild(mcCard(x,i+1,G[x.g].label,ex.ans[id],false,(j,b,ch)=>{
      ex.ans[id]=j;store("o3-exam",ex);ch.querySelectorAll("button").forEach(e=>e.setAttribute("aria-pressed",e===b));counts();
    }));
  });
  list.insertAdjacentHTML("beforeend",`<div class="sec">実技（鑑別）</div><p class="subsec">記述式。答えを下の欄に書いてください。</p>`);
  ex.kids.forEach((id,i)=>{
    const x=kById[id];const d=document.createElement("article");d.className="q";
    d.innerHTML=`<div class="qh"><span class="no">鑑別${i+1}</span></div>${x.fig?FIG[x.fig]:""}<p class="qt">${x.q}</p><textarea id="ta-${id}" aria-label="鑑別${i+1}の解答"></textarea>`;
    list.appendChild(d);const ta=d.querySelector("textarea");ta.value=ex.txt[id]||"";
    ta.oninput=()=>{ex.txt[id]=ta.value;store("o3-exam",ex);counts()};
  });
  const finBtns=[document.getElementById("fin"),document.getElementById("fin2")];let arm=false;
  finBtns.forEach(b=>b.onclick=()=>{
    const left=30-Object.keys(ex.ans).length;
    if(!arm){arm=true;finBtns.forEach(f=>f.textContent=left?`未解答${left}問。もう一度押すと採点`:"もう一度押すと採点");return}
    finish();
  });
  let qa=false;document.getElementById("quit").onclick=e=>{if(!qa){qa=true;e.target.textContent="もう一度押すと破棄";return}ex=null;store("o3-exam",null);renderExam()};
  counts();
  const upd=()=>{const rem=LIMIT-(Date.now()-ex.start);const t=document.getElementById("tm");if(t)t.textContent=fmt(rem);if(rem<=0)finish()};
  upd();tick=setInterval(upd,1000);
}
function counts(){
  const c=document.getElementById("cnt");if(c)c.textContent=`${Object.keys(ex.ans).length} / 30`;
  const k=document.getElementById("kcnt");if(k)k.textContent=`${ex.kids.filter(id=>(ex.txt[id]||"").trim()).length} / 5`;
}
function finish(){clearInterval(tick);ex.done=true;ex.end=Date.now();store("o3-exam",ex);renderExam();window.scrollTo({top:0})}

function renderResult(){
  const {out,tot,pass}=examScores();
  const kok=ex.kids.filter(id=>ex.self[id]==="o").length;const kDone=ex.kids.every(id=>ex.self[id]);
  const used=Math.min(LIMIT,(ex.end||Date.now())-ex.start);
  let rows=Object.entries(out).map(([s,v])=>{const p=v.ok/v.n>=0.4;return `<tr><td>${SUBJ[s].label}</td><td class="num">${v.ok} / ${v.n}</td><td class="num">${Math.round(v.ok/v.n*100)}%</td><td class="${p?"ok-t":"ng-t"}">${p?"40%以上":"40%未満"}</td></tr>`}).join("");
  rows+=`<tr><td><b>筆記合計</b></td><td class="num"><b>${tot} / 30</b></td><td class="num"><b>${Math.round(tot/30*100)}%</b></td><td class="${pass?"ok-t":"ng-t"}"><b>${pass?"筆記合格ライン":"筆記不合格"}</b></td></tr>`;
  rows+=`<tr><td>実技（鑑別）</td><td class="num">${kDone?kok+" / 5":"自己採点待ち"}</td><td class="num">${kDone?kok*20+"%":"—"}</td><td class="${kDone?(kok>=3?"ok-t":"ng-t"):""}">${kDone?(kok>=3?"60%以上":"60%未満"):""}</td></tr>`;
  app.innerHTML=`<section class="intro"><h2>採点結果</h2><p class="subsec">所要時間 ${fmt(used)}</p><div class="tw"><table><tr><th>科目</th><th>正答</th><th>正答率</th><th>判定</th></tr>${rows}</table></div>
<p style="font-size:.85rem;color:var(--muted)">実技は解答例と見比べて○×を付けてください。本試験の鑑別は部分点のある記述採点です。</p>
<div class="row"><button class="btn pri" id="again" type="button">新しい模擬試験を始める</button><button class="btn" id="retry" type="button">同じ問題で解き直す</button><button class="btn" id="wrong" type="button">${ex.onlyWrong?"すべて表示":"間違えた問題だけ表示"}</button></div></section>
<main id="rlist"></main>`;
  const list=document.getElementById("rlist");let last="";
  ex.ids.forEach((id,i)=>{
    const x=byId[id];const s=G[x.g].s;const p=ex.ans[id]===undefined?null:ex.ans[id];
    if(ex.onlyWrong&&p===x.a)return;
    if(s!==last){list.insertAdjacentHTML("beforeend",`<div class="sec">${SUBJ[s].label}</div>`);last=s}
    list.appendChild(mcCard(x,i+1,G[x.g].label,p,true,null));
  });
  list.insertAdjacentHTML("beforeend",`<div class="sec">実技（鑑別）</div>`);
  ex.kids.forEach((id,i)=>{
    const x=kById[id];const d=document.createElement("article");d.className="q";
    d.innerHTML=`<div class="qh"><span class="no">鑑別${i+1}</span></div>${x.fig?FIG[x.fig]:""}<p class="qt">${x.q}</p>
<div class="subsec">あなたの解答</div><div class="mine">${esc(ex.txt[id]||"（未記入）")}</div>
<div class="ex"><span class="r">解答例</span><div class="mine">${esc(x.k)}</div><div class="row">${phLink(x)}</div></div>
<div class="self"><button type="button" class="o" aria-pressed="${ex.self[id]==="o"}">○ 正解</button><button type="button" class="x" aria-pressed="${ex.self[id]==="x"}">× 不正解</button></div>`;
    const [bo,bx]=d.querySelectorAll(".self button");
    bo.onclick=()=>{ex.self[id]="o";store("o3-exam",ex);renderResult()};bx.onclick=()=>{ex.self[id]="x";store("o3-exam",ex);renderResult()};
    list.appendChild(d);
  });
  let a1=false;document.getElementById("again").onclick=e=>{if(!a1){a1=true;e.target.textContent="もう一度押すと新しい試験";return}newExam();renderExam();window.scrollTo({top:0})};
  document.getElementById("retry").onclick=()=>{ex={...ex,ans:{},txt:{},self:{},start:Date.now(),done:false,end:null,onlyWrong:false};store("o3-exam",ex);renderExam();window.scrollTo({top:0})};
  document.getElementById("wrong").onclick=()=>{ex.onlyWrong=!ex.onlyWrong;store("o3-exam",ex);renderResult()};
}

document.getElementById("lead").textContent=`筆記${P.length}問・鑑別${K.length}問のプールから、本番と同じ配分・形式で出題します。計算問題は「分野別練習」の計算ドリルで無制限に解けます。`;
renderModes();render();
